"3.2":[
"<b>Предел слева</b> lim (x→x₀−0) f(x) = A₁: ∀ε > 0 ∃δ > 0, что при x ∈ (x₀ − δ; x₀) |f(x) − A₁| < ε — подходим к x₀ только с левой стороны. <b>Справа</b> — x ∈ (x₀; x₀ + δ). Запись x₀ − 0 — не вычитание, а «слева от x₀».",
"<b>Теорема:</b> lim (x→x₀) f(x) = A существует ⇔ существуют оба односторонних предела и <b>A₁ = A₂ = A</b>. Если слева и справа функция «приходит» в разные числа (ступенька), общего предела нет.",
"sign x = −1 при x < 0 и 1 при x > 0. Слева предел <b>−1</b>, справа <b>1</b>; они не равны ⇒ <b>предела в нуле нет</b>. Это разрыв типа «скачок».",
"Доказательство ⇐: слева подходит δ₁, справа δ₂. Берём <b>δ = min(δ₁, δ₂)</b> — более узкий интервал лежит внутри обоих, поэтому неравенство |f(x) − A| < ε выполняется сразу с обеих сторон."],
"3.3":[
"<b>Определение.</b> A = lim (x→∞) f(x), если ∀ε > 0 ∃M > 0: при |x| > M выполняется |f(x) − A| < ε. Для x → +∞ условие x > M, для x → −∞ — x < −M. Вместо «близко к x₀» (δ) здесь «далеко от нуля» (M).",
"<b>Геометрический смысл:</b> при |x| > M график лежит в полосе между y = A − ε и y = A + ε, то есть «на краях» прижимается к прямой y = A. Эта прямая — <b>горизонтальная асимптота</b>.",
"arctg x возрастает и ограничен: при x → +∞ <b>arctg x → π/2</b>, при x → −∞ — к −π/2. Поэтому у него две горизонтальные асимптоты y = ±π/2, а общего предела при x → ∞ нет."],
"3.4":[
"<b>Бесконечно большая функция:</b> ∀M > 0 ∃δ > 0 такое, что при 0 < |x − x₀| < δ выполняется |f(x)| > M. Записывают lim f(x) = ∞ (+∞, если f > M; −∞, если f < −M). Какую бы границу M ни назвали, рядом с x₀ функция её превышает.",
"<b>1/x² → +∞ при x → 0</b>: для M = 10⁶ достаточно |x| < 0,001. sin x, x², cos x при x → 0 стремятся к 0, 0, 1 — конечные числа.",
"ббф всегда не ограничена, но <b>не всякая неограниченная — ббф</b>. x·sin x при x → ∞ принимает сколь угодно большие значения, но в точках x = πk равна 0, поэтому «|f(x)| > M для всех достаточно больших x» не выполняется."],
"3.5":[
"<b>Бесконечно малая функция:</b> α(x) — бмф при x → x₀, если lim (x→x₀) α(x) = 0, то есть ∀ε > 0 ∃δ > 0: 0 < |x − x₀| < δ ⇒ |α(x)| < ε. Это функция, стремящаяся к нулю, а не «маленькое число».",
"<b>1/x → 0 при x → ∞</b> — бмф. Другие примеры: sin x при x → 0, (x − 1)² при x → 1. Одна и та же функция может быть бмф при одном стремлении и не быть при другом.",
"<b>Доказательство:</b> для любого ε > 0 найдём δ₁, при котором |α| < ε/2, и δ₂, при котором |β| < ε/2. При δ = min(δ₁, δ₂): |α ± β| ≤ |α| + |β| < ε/2 + ε/2 = ε. Значит α ± β — бмф.",
"Теорема верна только для <b>конечного</b> числа слагаемых. Контрпример: сумма n слагаемых, каждое из которых равно 1/n, равна 1 при любом n, хотя каждое слагаемое → 0."],
"3.6":[
"<b>Теорема:</b> произведение функции, ограниченной в окрестности x₀, на бмф есть <b>бмф</b>. Следствия: бмф × число — бмф; бмф × бмф — бмф (бмф ограничена, так как имеет предел).",
"|sin(1/x)| ≤ 1 — ограничена, x → 0 — бмф. По теореме <b>x·sin(1/x) → 0</b>. Хотя сам sin(1/x) при x → 0 предела не имеет.",
"|f(x)| ≤ M; для бмф α найдём δ, при котором <b>|α| < ε/M</b>. Тогда |f·α| = |f|·|α| < M·(ε/M) = ε, то есть f·α → 0."],
"3.7":[
"<b>Теорема:</b> частное от деления бмф α(x) на функцию f(x), имеющую предел a ≠ 0, есть <b>бмф</b>. Условие a ≠ 0 важно: иначе получится, например, x/x² = 1/x → ∞.",
"α/f = α·(1/f). Так как f → a ≠ 0, рядом с x₀ |f(x)| > |a|/2, значит <b>|1/f| < 2/|a| — ограничена</b>. Произведение бмф на ограниченную функцию — бмф (теорема 3.6)."],
"3.8":[
"<b>Теорема:</b> если f — ббф, то <b>1/f — бмф</b>; если α — бмф и α ≠ 0, то 1/α — ббф. Пример при x → 0: x — бмф, 1/x — ббф.",
"Условие <b>α(x) ≠ 0</b> в окрестности x₀ нужно, чтобы 1/α вообще была определена.",
"Для f → ∞ и любого ε > 0 возьмём <b>M = 1/ε</b>: найдётся δ, при котором |f| > 1/ε, откуда |1/f| < ε. Обратно: для α → 0 и любого M берём ε = 1/M: |α| < 1/M ⇒ |1/α| > M."],
"3.9":[
"<b>Теорема:</b> если lim f(x) = A, то <b>f(x) = A + α(x)</b>, где α — бмф. И обратно: если f = A + α, α — бмф, то lim f = A. Доказательство — одна строка: α = f − A, и |f − A| < ε ⇔ |α| < ε.",
"Эта теорема — <b>основной инструмент</b> для теорем 3.10–3.12: записываем f = A + α, g = B + β, выполняем действие и показываем, что «лишнее» — бмф."],
"3.10":[
"<b>Теорема:</b> если lim f = A и lim g = B, то <b>lim (f ± g) = A ± B</b>. Предел суммы равен сумме пределов — если оба предела существуют.",
"<b>Доказательство:</b> по 3.9 f = A + α, g = B + β. Тогда f ± g = (A ± B) + (α ± β). α ± β — бмф (теорема о сумме бмф), значит по обратной теореме 3.9 lim (f ± g) = A ± B."],
"3.11":[
"f·g = (A + α)(B + β) = AB + (<b>Aβ + Bα + αβ</b>). Каждое слагаемое в скобке — бмф, их сумма — бмф. Значит lim fg = AB.",
"<b>Следствия:</b> lim (c·f) = c·lim f — постоянный множитель выносится за знак предела; lim fⁿ = (lim f)ⁿ для натурального n.",
"A — константа, а константа — ограниченная функция. Произведение ограниченной функции на бмф — бмф (3.6). Поэтому <b>Aβ и Bα — бмф</b>, а αβ — бмф как произведение двух бмф."],
"3.12":[
"<b>Теорема:</b> lim f/g = A/B при условии <b>B ≠ 0</b>. Если B = 0, возникает неопределённость (0/0) или бесконечность, и теорема не применима.",
"f/g − A/B = (A + α)/(B + β) − A/B = <b>(Bα − Aβ)/(B(B + β))</b>. Числитель — бмф, знаменатель → B² ≠ 0.",
"Дробь «бмф / функция с пределом B² ≠ 0» — бмф по <b>теореме 3.7</b>. Значит f/g = A/B + бмф, и по 3.9 lim f/g = A/B."],
"3.13":[
"<b>Теорема о двух милиционерах:</b> если в окрестности x₀ <b>φ(x) ≤ f(x) ≤ g(x)</b> и lim φ = lim g = A, то lim f = A. Доказательство: A − ε < φ ≤ f ≤ g < A + ε при δ = min(δ₁, δ₂).",
"Применяется в доказательстве <b>первого замечательного предела</b> (cos x < sin x/x < 1) и второго (оценка через [x]).",
"<b>Теорема о пределе монотонной функции:</b> если f монотонна и ограничена при x < x₀, то существует её левый предел в x₀ (при x > x₀ — правый). Это аналог теоремы Вейерштрасса для функций."],
"3.14":[
"<b>Первый замечательный предел: lim (x→0) sin x/x = 1.</b> Неопределённость 0/0. Следствия: tg x/x → 1, arcsin x/x → 1, arctg x/x → 1 при x → 0.",
"Единичная окружность, угол x ∈ (0; π/2). Треугольник OAB вписан в сектор, а сектор — в треугольник OCB с касательной: <b>½sin x < ½x < ½tg x</b> (площади).",
"Делим на ½sin x > 0: 1 < x/sin x < 1/cos x, переворачиваем: <b>cos x < sin x/x < 1</b>. cos x → 1, по теореме о милиционерах sin x/x → 1. Функция чётная, поэтому и при x → 0−0 тот же результат.",
"sin 5x/x = 5·(sin 5x/5x) → <b>5·1 = 5</b>. Можно и через эквивалентность: sin 5x ~ 5x."],
"3.15":[
"<b>Второй замечательный предел:</b> lim (x→∞) (1 + 1/x)ˣ = e, или в другой форме lim (x→0) (1 + x)^(1/x) = e. Доказывается через известный предел для последовательности и оценку n ≤ x < n + 1.",
"Основание → 1, показатель → ∞: <b>неопределённость 1^∞</b>. Её и раскрывает второй замечательный предел.",
"(1 + 2/x)ˣ = [(1 + 2/x)^(x/2)]². Внутренняя скобка → e (это второй замечательный предел с заменой t = x/2), поэтому ответ <b>e²</b>.",
"ln(1 + x)/x = ln(1 + x)^(1/x) → ln e = <b>1</b>. Аналогично (eˣ − 1)/x → 1, (aˣ − 1)/x → ln a."],
"4.1":[
"α и β — <b>одного порядка</b>, если lim α/β = A, где A — конечное и ≠ 0. Пример: sin 2x и x при x → 0, предел отношения 2.",
"<b>α = o(β)</b> («о малое»): lim α/β = 0 — α стремится к нулю быстрее, это бмф более высокого порядка. Если lim α/β = ∞ — α более низкого порядка.",
"x²/x = x → 0, поэтому <b>x² = o(x)</b> — более высокого порядка. При x = 0,01: x² = 0,0001 — во много раз меньше.",
"(1 − cos x)/x² → 1/2 ≠ 0, значит 1 − cos x — бмф <b>второго порядка</b> относительно x (определение: lim α/βᵏ = A ≠ 0 ⇒ порядок k)."],
"4.2":[
"<b>Эквивалентные бмф:</b> α ~ β, если lim α/β = 1. Частный случай бмф одного порядка (A = 1). Примеры: sin x ~ x, tg x ~ x.",
"sin 3x ~ 3x, tg 5x ~ 5x ⇒ lim sin 3x/tg 5x = lim 3x/5x = <b>3/5</b>. Замена допустима, потому что это отношение.",
"<b>Теорема:</b> α ~ α₁, β ~ β₁ ⇒ lim α/β = lim α₁/β₁. Доказательство: α/β = <b>(α/α₁)·(α₁/β₁)·(β₁/β)</b>; первый и третий множители → 1."],
"4.3":[
"<b>Теорема:</b> α ~ β ⇔ <b>α − β — бмф более высокого порядка</b>, чем α и чем β. То есть у эквивалентных бмф разность «исчезает быстрее» их самих. Пример: x − sin x ~ x³/6.",
"⇒: lim (α − β)/α = lim (1 − β/α) = <b>1 − 1 = 0</b>. ⇐: из lim (α − β)/α = 0 получаем lim β/α = 1."],
"4.4":[
"<b>Теорема:</b> сумма конечного числа бмф разных порядков эквивалентна <b>слагаемому низшего порядка</b> (тому, что стремится к нулю медленнее всех). Для двух: (α + β)/α = 1 + β/α → 1 при β = o(α).",
"x² и x³ — более высокого порядка, чем x, поэтому <b>x + 3x² + x³ ~ x</b>. Например, lim (3x + x²)/sin x = lim 3x/x = 3.",
"Слагаемое низшего порядка называют <b>главной частью</b> суммы. Замена суммы главной частью — это «отбрасывание бмф высших порядков»."],
"4.5":[
"<b>1 − cos x ~ x²/2</b> при x → 0. Вывод: 1 − cos x = 2sin²(x/2) ~ 2(x/2)² = x²/2.",
"<b>eˣ − 1 ~ x</b> при x → 0 — следствие второго замечательного предела. Также aˣ − 1 ~ x·ln a, ln(1 + x) ~ x.",
"<b>(1 + x)ᵏ − 1 ~ kx</b> при x → 0. Частный случай: √(1 + x) − 1 ~ x/2.",
"В <b>суммах и разностях</b> заменять нельзя: главные части могут сократиться. tg x − sin x ~ x³/2, а замена даёт x − x = 0 — неверно. Заменять можно множители в произведении и частном.",
"<b>sin x ~ x</b> геометрически: вблизи нуля график y = sin x почти совпадает с прямой y = x — касательной к нему в нуле. То же для tg x, ln(1 + x), eˣ − 1."],
"5.1":[
"<b>f непрерывна в точке x₀</b>, если она определена в окрестности x₀ (включая саму x₀) и <b>lim (x→x₀) f(x) = f(x₀)</b>. Три условия: f(x₀) определено; конечный предел существует; предел равен значению.",
"Через приращения: Δy = f(x₀ + Δx) − f(x₀); f непрерывна ⇔ <b>lim (Δx→0) Δy = 0</b> — малое изменение аргумента даёт малое изменение функции.",
"Непрерывность <b>на отрезке [a; b]</b>: непрерывна на (a; b), в точке a — <b>справа</b> (lim (x→a+0) f = f(a)), в точке b — слева. Слева от a функция может быть не определена."],
"5.2":[
"<b>Разрыв I рода:</b> оба односторонних предела существуют и <b>конечны</b>. Подвиды: устранимый (пределы равны, но ≠ f(x₀) или f не определена) и скачок (пределы различны).",
"sin x/x в нуле не определена, но оба односторонних предела равны 1 ⇒ <b>устранимый разрыв</b>. Доопределим f(0) = 1 — и функция станет непрерывной.",
"1/x при x → 0−0 → −∞, при x → 0+0 → +∞ — пределы бесконечны ⇒ <b>разрыв II рода</b>. Также II рода, если предел не существует (sin(1/x) в нуле).",
"sign x: слева −1, справа 1 — оба конечны, но различны ⇒ <b>скачок</b> (I рода), величина скачка |1 − (−1)| = 2."],
"5.3":[
"Если f и g непрерывны в x₀, то непрерывны f ± g, f·g и <b>f/g при g(x₀) ≠ 0</b>. Доказательство — из теорем о пределах: lim (f + g) = lim f + lim g = f(x₀) + g(x₀).",
"<b>Сложная функция:</b> u = φ(x) непрерывна в x₀, y = f(u) непрерывна в u₀ = φ(x₀) ⇒ f(φ(x)) непрерывна в x₀. При x → x₀ u → u₀, значит f(u) → f(u₀): lim f(φ(x)) = f(lim φ(x)).",
"<b>Обратная функция:</b> если y = f(x) непрерывна и строго монотонна на [a; b], то обратная существует, непрерывна и монотонна на соответствующем отрезке.",
"Основные элементарные функции непрерывны, а суммы, произведения, частные и суперпозиции непрерывных функций непрерывны ⇒ <b>все элементарные функции непрерывны в своей области определения</b>."],
"5.4":[
"<b>Теорема Вейерштрасса:</b> функция, непрерывная на <b>отрезке</b> [a; b], достигает на нём своего наибольшего M и наименьшего m значений: есть точки x₁, x₂ с f(x₁) = m, f(x₂) = M.",
"<b>Следствие:</b> непрерывная на отрезке функция ограничена на нём: m ≤ f(x) ≤ M.",
"Условие «отрезок» существенно: на интервале (0; 1) функция <b>1/x непрерывна, но не ограничена</b>; y = x на (0; 1) не достигает ни max, ни min."],
"5.5":[
"<b>Теорема 19.5 (Больцано–Коши)</b> у Письменного — о промежуточных значениях: если f непрерывна на [a; b] и f(a) = A ≠ f(b) = B, то для любого C между A и B найдётся c ∈ (a; b), что <b>f(c) = C</b>. Прямая y = C пересекает график хотя бы в одной точке.",
"<b>Следствие 19.2:</b> если f непрерывна на [a; b] и на концах принимает значения разных знаков, то найдётся c ∈ (a; b), где <b>f(c) = 0</b>: график переходит с одной стороны оси Ox на другую и потому пересекает её. Это частный случай теоремы при C = 0; на нём основан метод половинного деления.",
"f(0) = 0 + 0 − 1 = −1 < 0, f(1) = 1 + 1 − 1 = 1 > 0, f непрерывна ⇒ <b>есть корень на (0; 1)</b>. На этом основан метод половинного деления."],
"6.1":[
"<b>Производная:</b> f′(x₀) = lim (Δx→0) Δy/Δx = lim (f(x₀ + Δx) − f(x₀))/Δx — предел отношения приращения функции к приращению аргумента. Если он конечен, функция дифференцируема в x₀.",
"<b>Геометрический смысл:</b> f′(x₀) = tg α — угловой коэффициент касательной к графику в точке (x₀; f(x₀)), α — угол наклона касательной к оси Ox.",
"<b>Механический смысл:</b> если s = s(t) — путь, то s′(t) = v(t) — мгновенная скорость. В общем случае производная — скорость изменения функции."],
"6.2":[
"<b>Касательная:</b> y − y₀ = f′(x₀)(x − x₀) — прямая через (x₀; y₀) с угловым коэффициентом f′(x₀).",
"<b>Нормаль</b> — перпендикуляр к касательной в точке касания: y − y₀ = −(1/f′(x₀))(x − x₀). Коэффициенты перпендикулярных прямых: k₁·k₂ = −1. Если f′(x₀) = 0, нормаль — вертикальная прямая x = x₀.",
"Секущая через M₀ и M имеет коэффициент tg φ = Δy/Δx. При Δx → 0 точка M → M₀, и <b>секущая занимает предельное положение — касательную</b>; tg φ → f′(x₀).",
"y = x², f′ = 2x, f′(1) = 2, y₀ = 1: y − 1 = 2(x − 1) ⇒ <b>y = 2x − 1</b>. Нормаль: y − 1 = −½(x − 1) ⇒ y = −x/2 + 3/2."],
"6.3":[
"<b>Теорема:</b> если функция дифференцируема в точке, то она непрерывна в этой точке. Обратное неверно.",
"<b>|x|</b> непрерывна в нуле, но слева Δy/Δx = −1, справа +1 — производной нет (излом графика, касательной нет).",
"Доказательство (Письменный): Δy/Δx → f′(x), значит по теореме о связи функции, предела и бмф Δy/Δx = f′(x) + α, α → 0. Отсюда <b>Δy = f′(x)·Δx + α·Δx → 0</b> при Δx → 0 — это определение непрерывности через приращения."],
"6.4":[
"<b>(u ± v)′ = u′ ± v′</b> — производная суммы равна сумме производных (для любого конечного числа слагаемых).",
"y = u ± v ⇒ <b>Δy = Δu ± Δv</b>; делим на Δx: Δy/Δx = Δu/Δx ± Δv/Δx → u′ ± v′ при Δx → 0."],
"6.5":[
"<b>(uv)′ = u′v + uv′.</b> Следствие: (c·u)′ = c·u′ — константу выносим.",
"Δy = (u + Δu)(v + Δv) − uv = <b>Δu·v + u·Δv + Δu·Δv</b>. Делим на Δx: (Δu/Δx)·v + u·(Δv/Δx) + (Δu/Δx)·Δv.",
"v дифференцируема ⇒ <b>непрерывна (6.3) ⇒ Δv → 0</b>, поэтому последнее слагаемое → u′·0 = 0, и остаётся u′v + uv′."],
"6.6":[
"<b>(u/v)′ = (u′v − uv′)/v²</b>, v ≠ 0. Порядок в числителе: «производная верхней на нижнюю минус верхняя на производную нижней».",
"Δy = (u + Δu)/(v + Δv) − u/v = <b>(vΔu − uΔv)/(v(v + Δv))</b>. Делим на Δx и при Δx → 0 (Δv → 0) получаем (u′v − uv′)/v².",
"(tg x)′ = (sin x/cos x)′ = (cos x·cos x + sin x·sin x)/cos²x = <b>1/cos²x</b>."],
"6.7":[
"<b>Производная сложной функции:</b> y = f(u), u = φ(x) ⇒ <b>y′ₓ = y′ᵤ·u′ₓ</b> — производная внешней функции по промежуточному аргументу, умноженная на производную внутренней.",
"(sin x²)′ = cos(x²)·(x²)′ = <b>2x·cos x²</b>: внешняя sin u, внутренняя u = x².",
"Доказательство: Δy/Δx = (Δy/Δu)·(Δu/Δx). <b>u дифференцируема ⇒ непрерывна ⇒ Δu → 0</b> при Δx → 0, поэтому Δy/Δu → y′ᵤ."],
"6.8":[
"<b>Производная обратной функции: x′ᵧ = 1/y′ₓ</b>. Доказательство: Δx/Δy = 1/(Δy/Δx), и Δx → 0 при Δy → 0 (обратная функция непрерывна).",
"y = arcsin x ⇔ x = sin y; x′ᵧ = cos y ⇒ y′ = 1/cos y = 1/√(1 − sin²y) = <b>1/√(1 − x²)</b>. Корень берём с «+», так как y ∈ [−π/2; π/2], где cos y ≥ 0.",
"Условия: f <b>строго монотонна</b> (чтобы обратная существовала), дифференцируема и <b>f′(x) ≠ 0</b> (иначе делить на ноль)."],
"6.9":[
"<b>Неявная функция</b> F(x, y) = 0: дифференцируем обе части равенства по x, помня, что y = y(x) (поэтому (y²)′ = 2y·y′ по правилу сложной функции), и выражаем y′.",
"x² + y² = 1 ⇒ 2x + 2y·y′ = 0 ⇒ <b>y′ = −x/y</b>.",
"<b>Параметрическая функция</b> x = x(t), y = y(t): <b>y′ₓ = y′ₜ/x′ₜ</b>. Вывод: y = y(t(x)) — сложная, а t′ₓ = 1/x′ₜ — производная обратной.",
"y′ₜ = cos t, x′ₜ = −sin t ⇒ y′ₓ = cos t/(−sin t) = <b>−ctg t</b>."],
"6.10":[
"<b>Логарифмическое дифференцирование</b> — для степенно-показательных функций u(x)^v(x) и громоздких произведений/частных: логарифмируем, дифференцируем, выражаем y′.",
"y = xˣ: ln y = x·ln x; (ln y)′ = y′/y = ln x + x·(1/x) = ln x + 1 ⇒ <b>y′ = xˣ(ln x + 1)</b>.",
"<b>Потенцирование:</b> uᵛ = e^(v·ln u), дифференцируем как сложную показательную: y′ = e^(v ln u)·(v ln u)′ = uᵛ(v′ln u + v·u′/u).",
"<b>(ln y)′ = y′/y</b> — логарифмическая производная (производная сложной функции ln u)."],
"6.11":[
"<b>Производная второго порядка</b> y″ = (y′)′ — производная от первой производной. n-го порядка: y⁽ⁿ⁾ = (y⁽ⁿ⁻¹⁾)′.",
"<b>Механический смысл:</b> s′(t) = v(t) — скорость, s″(t) = v′(t) = <b>a(t) — ускорение</b>.",
"Производная eˣ равна eˣ, поэтому <b>(eˣ)⁽ⁿ⁾ = eˣ</b> для любого n.",
"(sin x)′ = cos x = sin(x + π/2): каждое дифференцирование сдвигает аргумент на π/2 ⇒ <b>(sin x)⁽ⁿ⁾ = sin(x + nπ/2)</b>."],
"6.12":[
"Δy = f′(x)Δx + α·Δx, α → 0. <b>Дифференциал dy = f′(x)·Δx</b> — главная, линейная относительно Δx часть приращения. Для y = x: dx = Δx, поэтому dy = f′(x)dx и f′(x) = dy/dx.",
"<b>Геометрический смысл:</b> dy — приращение ординаты <b>касательной</b> при переходе от x к x + Δx; Δy — приращение ординаты самого графика.",
"Δy − dy = α·Δx — <b>бмф более высокого порядка, чем Δx</b>. Поэтому при малых Δx можно считать Δy ≈ dy."],
"6.13":[
"<b>d(uv) = v·du + u·dv.</b> Доказательство: d(uv) = (uv)′dx = (u′v + uv′)dx = v·(u′dx) + u·(v′dx) = v du + u dv.",
"<b>d(u/v) = (v du − u dv)/v²</b> — как производная частного, умноженная на dx. Также dc = 0, d(u ± v) = du ± dv, d(cu) = c du.",
"Все формулы получаются из <b>dy = y′dx</b> и правил дифференцирования 6.4–6.6."],
"6.14":[
"y = f(u), u = φ(x): dy = f′(u)φ′(x)dx, а φ′(x)dx = du ⇒ <b>dy = f′(u)du</b>.",
"Форма dy = f′(u)du одинакова, будь u независимой переменной или функцией — это <b>инвариантность формы первого дифференциала</b>.",
"<b>Второй дифференциал не инвариантен:</b> для сложной функции d²y = f″(u)du² + f′(u)d²u, а не просто f″(u)du²."],
"6.15":[
"<b>(aˣ)′ = aˣ·ln a</b>; частный случай a = e: (eˣ)′ = eˣ. Не путать со степенной: (xⁿ)′ = n·xⁿ⁻¹.",
"<b>(arctg x)′ = 1/(1 + x²)</b>, (arcctg x)′ = −1/(1 + x²); (arcsin x)′ = 1/√(1 − x²).",
"<b>(ctg x)′ = −1/sin²x</b>, (tg x)′ = 1/cos²x.",
"<b>(logₐx)′ = 1/(x·ln a)</b>; при a = e: (ln x)′ = 1/x.",
"(sin x)′: Δy = 2sin(Δx/2)cos(x + Δx/2); Δy/Δx = [sin(Δx/2)/(Δx/2)]·cos(x + Δx/2) → 1·cos x — по <b>первому замечательному пределу</b>."],
"6.16":[
"Из Δy ≈ dy: <b>f(x₀ + Δx) ≈ f(x₀) + f′(x₀)·Δx</b> — функция вблизи x₀ заменяется касательной.",
"f = √x, x₀ = 4, Δx = 0,02, f′(4) = 1/(2√4) = 1/4: √4,02 ≈ 2 + 0,02/4 = <b>2,005</b>.",
"<b>d²y = d(dy) = f″(x)dx²</b> (dx — постоянная, если x независимая), dⁿy = f⁽ⁿ⁾(x)dxⁿ.",
"y = x³: y′ = 3x², y″ = 6x ⇒ dy = 3x²dx, <b>d²y = 6x dx²</b>, d³y = 6dx³."],
"6.17":[
"<b>Теорема Ролля:</b> f непрерывна на [a; b], дифференцируема на (a; b), <b>f(a) = f(b)</b> ⇒ ∃c ∈ (a; b): f′(c) = 0.",
"Вывод: найдётся точка внутри, где <b>f′(c) = 0</b>. Нарушение условия ломает теорему: у |x| на [−1; 1] f(−1) = f(1), но f′ нигде не равна 0 (в нуле её нет).",
"По <b>Вейерштрассу</b> f достигает на [a; b] max M и min m. Если M = m — f константа. Иначе одно из них достигается внутри, в точке c; там Δy ≤ 0 (для max), и знаки Δy/Δx слева и справа дают f′(c) ≤ 0 и f′(c) ≥ 0 ⇒ f′(c) = 0.",
"<b>Геометрически:</b> если концы дуги на одной высоте, то найдётся точка с <b>горизонтальной касательной</b>."],
"6.18":[
"<b>Теорема Коши:</b> f, g непрерывны на [a; b], дифференцируемы на (a; b), g′ ≠ 0 ⇒ ∃c: <b>(f(b) − f(a))/(g(b) − g(a)) = f′(c)/g′(c)</b>.",
"Вводим λ = (f(b) − f(a))/(g(b) − g(a)) и <b>F(x) = f(x) − f(a) − λ(g(x) − g(a))</b>. F(a) = F(b) = 0 ⇒ по Роллю F′(c) = f′(c) − λg′(c) = 0 ⇒ λ = f′(c)/g′(c).",
"Если бы g(b) = g(a), то по Роллю нашлась бы точка с g′ = 0, а по условию <b>g′ ≠ 0</b>. Значит знаменатель не ноль."],
"6.19":[
"<b>Теорема Лагранжа:</b> f непрерывна на [a; b] и дифференцируема на (a; b) ⇒ ∃c: <b>f(b) − f(a) = f′(c)(b − a)</b> — формула конечных приращений.",
"В теореме Коши берём <b>g(x) = x</b>: g′ = 1, g(b) − g(a) = b − a ⇒ (f(b) − f(a))/(b − a) = f′(c).",
"(f(b) − f(a))/(b − a) — угловой коэффициент хорды AB. Найдётся c, где <b>касательная параллельна хорде</b>. Механически: найдётся момент, когда мгновенная скорость равна средней."],
"6.20":[
"<b>Правило Лопиталя:</b> при неопределённости 0/0 или ∞/∞, если существует lim f′/g′, то <b>lim f/g = lim f′/g′</b>. Дифференцируют числитель и знаменатель <b>отдельно</b>, а не дробь целиком.",
"Доказательство (0/0) через <b>теорему Коши</b>: доопределим f(x₀) = g(x₀) = 0; f(x)/g(x) = (f(x) − f(x₀))/(g(x) − g(x₀)) = f′(c)/g′(c), и c → x₀ при x → x₀.",
"Неопределённость ∞/∞: lim x/eˣ = lim 1/eˣ = <b>0</b>. Показательная функция растёт быстрее любой степенной.",
"Для 1^∞, 0⁰, ∞⁰: y = uᵛ ⇒ <b>ln y = v·ln u</b> — получается 0·∞, которую сводят к 0/0 или ∞/∞, а потом y = e^(lim ln y)."],
"6.21":[
"<b>Необходимое условие:</b> если дифференцируемая на (a; b) функция возрастает, то <b>f′(x) ≥ 0</b>; если убывает — f′(x) ≤ 0. Доказательство: Δy/Δx > 0 и предельный переход в неравенстве.",
"Нестрогий знак: <b>x³ возрастает на ℝ, но f′(0) = 0</b>. При переходе к пределу строгое > может стать ≥.",
"<b>Геометрически:</b> касательные к графику возрастающей функции образуют с осью Ox <b>острые углы</b> или горизонтальны ⇒ tg α ≥ 0."],
"6.22":[
"<b>Достаточное условие:</b> f′(x) > 0 на (a; b) ⇒ f <b>возрастает</b>; f′ < 0 ⇒ убывает.",
"Доказательство по <b>Лагранжу</b>: для x₁ < x₂ f(x₂) − f(x₁) = f′(c)(x₂ − x₁).",
"f′(c) > 0 и x₂ − x₁ > 0 ⇒ произведение > 0 ⇒ <b>f(x₂) > f(x₁)</b> — это определение возрастания."],
"6.23":[
"<b>x₀ — точка максимума</b>, если существует δ-окрестность x₀, в которой f(x) < f(x₀) при x ≠ x₀ (минимума — f(x) > f(x₀)). Экстремум — <b>локальное</b> понятие: сравниваем только с соседями, а не со всей областью.",
"<b>Теорема Ферма (необходимое условие):</b> если дифференцируемая функция имеет экстремум в x₀, то <b>f′(x₀) = 0</b>. Доказательство как у Ролля: знаки Δy/Δx слева и справа.",
"Условие не достаточно: у <b>y = x³</b> f′(0) = 0, но функция возрастает везде, экстремума нет.",
"Экстремум бывает там, где <b>производной нет</b>: |x| имеет минимум в нуле. Поэтому ищут экстремумы среди всех критических точек."],
"6.24":[
"<b>Критические точки</b> — точки из D(f), где f′ = 0 (стационарные) или f′ не существует. Только в них может быть экстремум.",
"<b>1-е достаточное условие:</b> f′ меняет знак при переходе через x₀ с «+» на «−» ⇒ <b>максимум</b> (функция росла, потом стала убывать); с «−» на «+» ⇒ минимум; знак не меняется ⇒ экстремума нет.",
"<b>2-е достаточное условие:</b> f′(x₀) = 0 и f″(x₀) > 0 ⇒ <b>минимум</b> (график вогнутый, «чашка»); f″(x₀) < 0 ⇒ максимум."],
"6.25":[
"<b>Теорема 25.11:</b> f″ < 0 на (a; b) ⇒ график <b>выпуклый вверх</b> («шапка»), лежит ниже своих касательных; f″ > 0 ⇒ <b>выпуклый вниз</b> («чашка», в других учебниках — вогнутый), выше касательных.",
"<b>Точка перегиба</b> — где выпуклость меняется на вогнутость. Достаточное условие: f″(x₀) = 0 или не существует, и <b>f″ меняет знак</b> при переходе через x₀. Пример: x³ в нуле.",
"<b>Наклонная асимптота</b> y = kx + b: k = lim f(x)/x, b = lim (f(x) − kx) при x → ±∞. При k = 0 это горизонтальная асимптота.",
"<b>Вертикальная асимптота</b> x = a: хотя бы один односторонний предел в a бесконечен, lim (x→a±0) f(x) = ±∞. Обычно в точках разрыва II рода (нули знаменателя)."],
"6.26":[
"Многочлен Тейлора Pₙ строится так, чтобы его значение и производные до n-й в x₀ совпадали с f: отсюда <b>aₖ = f⁽ᵏ⁾(x₀)/k!</b>. f(x) = f(x₀) + f′(x₀)(x − x₀) + f″(x₀)/2!·(x − x₀)² + … + Rₙ(x).",
"<b>Форма Лагранжа:</b> Rₙ = f⁽ⁿ⁺¹⁾(c)/(n + 1)!·(x − x₀)ⁿ⁺¹, c между x₀ и x. При n = 0 это формула Лагранжа f(x) − f(x₀) = f′(c)(x − x₀).",
"<b>Разложение в ряд Тейлора</b> f(x) = Σ f⁽ᵏ⁾(x₀)/k!·(x − x₀)ᵏ верно, если <b>Rₙ(x) → 0 при n → ∞</b>. Достаточно, например, чтобы все производные были ограничены одним числом M.",
"<b>Форма Пеано:</b> Rₙ = o((x − x₀)ⁿ) — остаток бесконечно мал по сравнению с (x − x₀)ⁿ при x → x₀."],
"6.27":[
"<b>Формула Маклорена</b> — формула Тейлора при <b>x₀ = 0</b>: f(x) = f(0) + f′(0)x + f″(0)/2!·x² + … + f⁽ⁿ⁾(0)/n!·xⁿ + Rₙ.",
"Все производные eˣ равны eˣ, в нуле = 1 ⇒ <b>eˣ = 1 + x + x²/2! + x³/3! + …</b> Подставив x = 1, получаем e ≈ 2,718.",
"<b>sin x = x − x³/3! + x⁵/5! − …</b> — нечётные степени, знаки чередуются. cos x = 1 − x²/2! + x⁴/4! − … — чётные степени.",
"<b>ln(1 + x) = x − x²/2 + x³/3 − …</b> при −1 < x ≤ 1 — без факториалов. (1 + x)ᵐ = 1 + mx + m(m − 1)/2!·x² + …",
"sin x нечётная, её производные чётного порядка (±sin x) в нуле равны 0 ⇒ <b>в разложении только нечётные степени</b>. У чётного cos x — только чётные."]
};

<script>
const LV=[{n:"Не начат",c:"var(--s0)"},{n:"Не помню",c:"var(--s1)"},{n:"С трудом",c:"var(--s2)"},{n:"Помню",c:"var(--s3)"},{n:"Отлично",c:"var(--s4)"}];
const BYID={};T.forEach((x,i)=>{x.s=+x.id.split(".")[0];x.i=i;BYID[x.id]=x});
const DAYOF={};PLAN.forEach((d,i)=>{if(Array.isArray(d))d.forEach(id=>DAYOF[id]=i)});
const day0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const addD=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const TODAY=()=>iso(new Date());
let S={v:1,start:"2026-11-24",planV:2,t:{},log:{},upd:0};
let mode={hide:false,tab:'theory'};let QZ=null;
try{const ls=localStorage.getItem("matan-progress");if(ls)S=Object.assign(S,JSON.parse(ls))}catch(e){}
const NDAYS=PLAN.length;
function migrate(){if(S.planV!==2){S.start=PLAN_START;S.planV=2}}migrate();
let dbRef=null,saving=false,pending=false,saveTimer=null,syncNote="";
function persist(){S.upd=Date.now();try{localStorage.setItem("matan-progress",JSON.stringify(S))}catch(e){}
 clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){if(!dbRef)return;if(saving){pending=true;return}saving=true;
 try{await dbRef.set(JSON.parse(JSON.stringify(S)));syncNote="Прогресс сохранён в облаке"}catch(e){syncNote="Не удалось сохранить в облако, прогресс хранится в этом браузере"}
 saving=false;if(pending){pending=false;flush()}}
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use("db");const user=await claude.use("user");if(!db||!user)return;
 const uid=await user.id();if(!uid)return;dbRef=db.doc("data/users/"+uid+"/progress");
 const snap=await dbRef.get();if(snap.exists){const d=snap.data();if(d&&(d.upd||0)>(S.upd||0)){S=Object.assign({v:1,t:{},log:{}},JSON.parse(JSON.stringify(d)));migrate();try{localStorage.setItem("matan-progress",JSON.stringify(S))}catch(e){}render()}else if((S.upd||0)>(d.upd||0))flush()}else if(S.upd)flush();
 syncNote="Прогресс синхронизируется между устройствами";render()}catch(e){}})();

const st=id=>S.t[id]||{l:0};
const lvl=id=>st(id).l||0;
function dayIdx(){return Math.max(0,diffD(S.start,TODAY()))}
function due(){const t=TODAY();return T.filter(x=>{const s=st(x.id);return s.l>0&&s.d&&s.d<=t})}
function weak(){return T.filter(x=>{const l=lvl(x.id);return l>0&&l<=2})}
function rate(id,r){const s=Object.assign({l:0,n:0},st(id));const gaps={1:1,2:2,3:4,4:7};
 let l=r==0?1:r==1?2:r==2?Math.max(3,Math.min(4,s.l>=3?s.l+1:3)):4;
 const g=r==2&&s.l>=3?Math.min(7,(s.g||2)*2):gaps[l];
 S.t[id]={l,n:(s.n||0)+1,last:TODAY(),d:addD(TODAY(),g),g};
 const k=TODAY();S.log[k]=(S.log[k]||0)+1;persist()}

 ${q.opts.map((o,k)=>{let c="";if(answered){if(o.c)c="ok";else if(k===z.pick)c="bad"}return `<button class="opt ${c}" ${answered?"disabled":""} onclick="qPick(${k})"><span class="k">${k+1}</span><span>${o.o}</span></button>`}).join("")}

function doRate(id,r){rate(id,r);if(SES&&SES.i<SES.q.length&&SES.q[SES.i]===id){SES.res[r]++;SES.i++;SES.shown=false;SES.t0=Date.now()}
 else{const x=BYID[id];const di=dayIdx();const d=PLAN[Math.min(di,NDAYS-1)];let nx=null;
  if(Array.isArray(d)){const rest=d.filter(i=>lvl(i)===0);if(rest.length)nx=rest[0]}
  mode.hide=false;if(nx){location.hash="t-"+nx.replace(".","-");return}}
 render();window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||!QZ||QZ.done)return;const h=location.hash.slice(1);if(!(h==="train"||(h.startsWith("t-")&&mode.tab==="quiz")))return;
 if(/^[1-4]$/.test(e.key)&&QZ.pick===null)qPick(+e.key-1);else if(e.key==="Enter"&&QZ.pick!==null){e.preventDefault();qNext()}});
function curRateId(){const h=location.hash.slice(1);if(h.startsWith("t-"))return h.slice(2).replace("-",".");
 if(h==="train"&&SES&&SES.i<SES.q.length&&SES.shown)return SES.q[SES.i];return null}

function render(){header();const h=location.hash.slice(1)||"today";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+(h.startsWith("t-")?"tickets":h)));
 const app=document.getElementById("app");
 app.innerHTML=h==="tickets"?vTickets():h==="train"?vTrain():h==="progress"?vProgress():h.startsWith("t-")?vTicket(h.slice(2).replace("-",".")):vToday();
 clearInterval(tick);
 if(h==="train"&&SES&&SES.i<SES.q.length&&SES.oral){const f=()=>{const el=document.getElementById("tmr");if(!el)return;let s=Math.floor((Date.now()-SES.t0)/1000);
  if(SES.limit){s=SES.limit-s;el.style.color=s<0?"var(--s1)":"";s=Math.abs(s)}el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};f();tick=setInterval(f,1000)}}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{mode.hide=false;mode.tab='theory';if(QZ&&QZ.ctx==="t")QZ=null;render();window.scrollTo(0,0)});
render();
</script>
