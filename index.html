<head>

<title>Матанализ: подготовка к экзамену 13 января</title>

<style>
:root{--bg:#f5f2ec;--card:#fffdf9;--ink:#1e1c19;--mute:#6f6a61;--line:#e4ded3;--acc:#2f4bc0;--acc-bg:#e9ecfb;
--s0:#d9d4ca;--s1:#d65a4a;--s2:#e3a42b;--s3:#4fa874;--s4:#1f7a50;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1c;--ink:#efebe3;--mute:#a39e94;--line:#34322d;--acc:#8ea0f5;--acc-bg:#262c4a;--s0:#3a3833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 110px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:600 22px/1.2 "Golos Text";margin:0}
.sub{color:var(--mute);font-size:14px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
nav{display:flex;gap:6px;margin:14px 0 20px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);border:1px solid var(--line);font-size:15px;background:var(--card)}
nav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
h2{font:600 18px/1.3 "Golos Text";margin:0 0 10px}
h3{font:600 15px/1.3 "Golos Text";margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.tl{display:flex;flex-direction:column;gap:6px}
.ti{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.ti:hover{border-color:var(--acc)}
.ti .id{font-weight:600;min-width:40px}
.ti .nm{flex:1;font-size:14.5px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--acc-bg);color:var(--acc);white-space:nowrap}
.btn{font:500 15px "Golos Text";padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.theory{font:17px/1.65 "PT Serif",Georgia,serif}
.theory p{margin:0 0 10px}.theory ul{margin:0 0 10px;padding-left:22px}
.theory table{border-collapse:collapse;font:14px/1.4 "Golos Text";width:100%;margin:6px 0}
.theory td,.theory th{border:1px solid var(--line);padding:5px 7px;text-align:left}
.plan{margin:0;padding-left:22px}.plan li{margin:3px 0}
.proof{border-left:3px solid var(--acc);padding:4px 0 4px 14px;margin:8px 0}
details{border-top:1px solid var(--line);padding:10px 0}details summary{cursor:pointer;font-weight:500}
details div{margin-top:6px;color:var(--mute)}
.hidden-ans{filter:blur(7px);user-select:none;pointer-events:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}

.cell{width:46px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;text-decoration:none;color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cd.part{background:var(--s2);color:#fff;border-color:var(--s2)}
.cd.off{background:var(--line);color:var(--mute)}.cd.exam{background:var(--acc);color:#fff;border-color:var(--acc)}
.bk{display:inline-block;width:9px;height:11px;border:1.5px solid currentColor;border-radius:1px 3px 3px 1px;margin-right:6px;vertical-align:-1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}

.timer{font:600 34px/1 "Golos Text";font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--mute)}
.sec{margin-bottom:10px}.sec .row{justify-content:space-between;font-size:14px;margin-bottom:4px}
input[type=date]{font:15px "Golos Text";padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin:14px 0 4px;width:max-content}
.tabs button{font:500 15px "Golos Text";border:0;background:transparent;color:var(--mute);padding:8px 18px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.qprog{display:flex;gap:4px;margin:6px 0 16px}.qprog i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.qprog i.ok{background:var(--s3)}.qprog i.bad{background:var(--s1)}.qprog i.cur{background:var(--acc)}
.qq{font:500 18px/1.45 "Golos Text";margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:16px/1.45 "PT Serif",serif;padding:12px 14px;margin-bottom:8px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--acc)}.opt[disabled]{cursor:default}
.opt .k{font:600 13px "Golos Text";color:var(--mute);border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.ok{border-color:var(--s3);background:color-mix(in srgb,var(--s3) 12%,var(--card))}.opt.bad{border-color:var(--s1);background:color-mix(in srgb,var(--s1) 12%,var(--card))}
.verdict{font-weight:600;margin:6px 0}.verdict.ok{color:var(--s4)}.verdict.bad{color:var(--s1)}
.expl{border-left:3px solid var(--acc);background:var(--acc-bg);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0 14px;font:16px/1.6 "PT Serif",serif;color:var(--ink)}
.expl b{color:var(--ink)}.expl .h{font:600 12.5px "Golos Text";text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin-bottom:4px}
.score{font:600 44px/1 "Golos Text";margin:6px 0}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
@media (max-width:560px){.cd span{display:none}.ti .nm{font-size:13.5px}}

<script>
const SECTIONS={1:"Функция",2:"Последовательности",3:"Предел функции",4:"Эквивалентные бмф",5:"Непрерывность функции",6:"Производная функции"};
const T=[
{id:"1.1",ref:"§14.1–14.3, с. 120–123",t:"Понятие функции. Числовые функции. График функции. Способы задания функций. Основные характеристики функций",
plan:["Определение функции, D(f), E(f)","Числовая функция и график","Способы задания","Чётность, монотонность, ограниченность, периодичность"],
say:`<p><b>Функция.</b> Пусть X и Y — непустые множества. Соответствие f, которое <b>каждому</b> x ∈ X сопоставляет <b>единственный</b> y ∈ Y, называется функцией: y = f(x). X = D(f) — область определения, E(f) — множество значений.</p>
<p><b>Числовая функция:</b> X ⊂ ℝ, Y ⊂ ℝ. <b>График</b> — множество точек плоскости (x; f(x)), x ∈ D(f).</p>
<p><b>Способы задания</b> (у Письменного — три основных): <b>аналитический</b> — одной или несколькими формулами или уравнениями (самый совершенный: к нему применимы методы анализа); <b>графический</b> — графиком (плюс — наглядность, минус — неточность); <b>табличный</b> — таблицей значений аргумента и функции. Иногда добавляют <b>словесный</b> способ (например, y = [x]).</p>
<p><b>Характеристики</b> (f определена на D):</p>
<ul><li><b>Чётная:</b> −x ∈ D и f(−x) = f(x); график симметричен относительно Oy. <b>Нечётная:</b> f(−x) = −f(x); симметричен относительно начала координат.</li>
<li><b>Возрастающая</b> на D₁: x₁ < x₂ ⇒ f(x₁) < f(x₂); <b>неубывающая</b>: f(x₁) ≤ f(x₂); <b>убывающая</b>: f(x₁) > f(x₂); <b>невозрастающая</b>: f(x₁) ≥ f(x₂). Все они — монотонные, а возрастающие и убывающие — строго монотонные.</li>
<li><b>Ограниченная:</b> ∃M > 0: |f(x)| ≤ M для всех x ∈ D.</li>
<li><b>Периодическая:</b> ∃T > 0: при каждом x ∈ D x + T ∈ D и f(x + T) = f(x). Тогда периоды и m·T (m = ±1, ±2, …); наименьший положительный — основной период (у sin x это 2π).</li></ul>`,
qa:[["Почему окружность x² + y² = 1 — не график функции?","Одному x соответствуют два значения y, а функция требует единственное."],["Что обязательно для чётности/нечётности?","Область определения симметрична относительно нуля."],["Пример ограниченной и неограниченной функции?","sin x ограничена (|sin x| ≤ 1), x² — нет."],["Период sin kx?","2π/|k|."]]},
{id:"1.2",ref:"§14.4–14.5, с. 123–124",t:"Обратная функция. Сложная функция",
plan:["Определение обратной функции","Как найти","Свойства: монотонность, симметрия графиков","Сложная функция, промежуточный аргумент"],
say:`<p><b>Обратная функция.</b> Пусть y = f(x) имеет область определения D и множество значений E. Если каждому y ∈ E соответствует единственное x ∈ D, то определена функция x = φ(y) с D(φ) = E и E(φ) = D. Она называется обратной: x = f⁻¹(y).</p>
<p>Чтобы найти: выражаем x через y и меняем x и y местами. Пример: y = 2x + 3 → y = (x − 3)/2.</p>
<ul><li>Функция имеет обратную <b>тогда и только тогда</b>, когда задаёт взаимно однозначное соответствие между D и E.</li><li>Любая строго монотонная функция имеет обратную; если f возрастает (убывает), то и обратная возрастает (убывает).</li><li>Графики взаимно обратных функций симметричны относительно биссектрисы I и III координатных углов, прямой y = x.</li><li>Пример: y = x² на [0; 1] имеет обратную x = √y, а на [−1; 1] — нет (y = 4 даёт x = 2 и x = −2).</li></ul>
<p><b>Сложная функция.</b> Если y = f(u), а u = φ(x), причём значения φ(x) входят в область определения f, то y = f(φ(x)) — сложная функция (суперпозиция). u — промежуточный аргумент. Пример: y = sin 2x: y = sin u, u = 2x.</p>`,
qa:[["Почему у y = x² на всей прямой нет обратной?","Значение 4 получается из 2 и из −2 — нет взаимной однозначности. Берут x ≥ 0, тогда обратная √x."],["Примеры взаимно обратных пар?","eˣ и ln x; sin x на [−π/2; π/2] и arcsin x."]]},
{id:"1.3",ref:"§14.6, с. 124–127",t:"Основные элементарные функции и их характеристики",
plan:["Перечислить 5 групп","Элементарная функция — определение","Для каждой: D, E, чётность, монотонность, период, ограниченность"],
say:`<p><b>Основные элементарные функции</b> (порядок у Письменного): показательная y = aˣ; степенная y = xᵅ; логарифмическая y = logₐx; тригонометрические sin, cos, tg, ctg; обратные тригонометрические arcsin, arccos, arctg, arcctg.</p>
<p><b>Элементарная функция</b> — задана одной формулой из основных элементарных функций и постоянных с помощью конечного числа арифметических операций и взятия функции от функции.</p>
<table><tr><th>Функция</th><th>D</th><th>E</th><th>Свойства</th></tr>
<tr><td>x²</td><td>ℝ</td><td>[0; +∞)</td><td>чётная, ↓ на (−∞; 0], ↑ на [0; +∞)</td></tr>
<tr><td>x³</td><td>ℝ</td><td>ℝ</td><td>нечётная, ↑</td></tr>
<tr><td>aˣ</td><td>ℝ</td><td>(0; +∞)</td><td>↑ при a > 1, ↓ при 0 < a < 1</td></tr>
<tr><td>logₐx</td><td>(0; +∞)</td><td>ℝ</td><td>↑ при a > 1, ↓ при 0 < a < 1</td></tr>
<tr><td>sin x</td><td>ℝ</td><td>[−1; 1]</td><td>нечётная, T = 2π, ограничена</td></tr>
<tr><td>cos x</td><td>ℝ</td><td>[−1; 1]</td><td>чётная, T = 2π, ограничена</td></tr>
<tr><td>tg x</td><td>x ≠ π/2 + πk</td><td>ℝ</td><td>нечётная, T = π</td></tr>
<tr><td>ctg x</td><td>x ≠ πk</td><td>ℝ</td><td>нечётная, T = π</td></tr>
<tr><td>arcsin x</td><td>[−1; 1]</td><td>[−π/2; π/2]</td><td>нечётная, ↑</td></tr>
<tr><td>arccos x</td><td>[−1; 1]</td><td>[0; π]</td><td>↓</td></tr>
<tr><td>arctg x</td><td>ℝ</td><td>(−π/2; π/2)</td><td>нечётная, ↑</td></tr>
<tr><td>arcctg x</td><td>ℝ</td><td>(0; π)</td><td>↓</td></tr></table>`,
qa:[["Как быстро вспомнить D и E обратной функции?","Они меняются местами с исходной: D(arcsin) = E(sin на [−π/2; π/2]) = [−1; 1]."],["Какие из основных функций ограничены?","sin, cos, arcsin, arccos, arctg, arcctg."]]},
{id:"2.1",ref:"§15.1–15.2, с. 127–129",t:"Числовая последовательность (ЧП). Предел ЧП",
plan:["Определение ЧП","Способы задания","Ограниченность, монотонность","Определение предела (ε–N)","Пример"],
say:`<p><b>Числовая последовательность</b> — функция натурального аргумента xₙ = f(n), n ∈ ℕ. Обозначается {xₙ}, xₙ — общий член. Задаётся формулой общего члена (xₙ = 1/n) или рекуррентно (задан x₁ и правило xₙ = f(xₙ₋₁)). Если все члены равны c — последовательность постоянная, её предел c.</p>
<p><b>Ограничена:</b> ∃M > 0: |xₙ| ≤ M для всех n. <b>Возрастает:</b> xₙ₊₁ > xₙ; <b>убывает:</b> xₙ₊₁ < xₙ.</p>
<p><b>Предел.</b> Число a называется пределом последовательности {xₙ}, если для любого ε > 0 найдётся номер N такой, что при всех n > N выполняется |xₙ − a| < ε. Пишут lim xₙ = a (n → ∞).</p>
<p><b>Пример:</b> lim n/(n + 1) = 1: |n/(n + 1) − 1| = 1/(n + 1) < ε при n > 1/ε − 1, берём N = [1/ε].</p>`,
qa:[["Что значат ε и N?","ε — сколь угодно малая погрешность; N — номер, начиная с которого все члены отличаются от a меньше чем на ε. N зависит от ε."],["Может ли быть два предела?","Нет, предел единственен."],["Чем ЧП отличается от функции?","Это частный случай функции, аргумент — только натуральные числа."]]},
{id:"2.2",ref:"§15.2, с. 129–130",t:"Геометрический смысл определения ЧП. Сходящаяся и расходящаяся ЧП. Примеры сходящейся и расходящейся ЧП",
plan:["|xₙ − a| < ε ⇔ a − ε < xₙ < a + ε","ε-окрестность","Геометрический смысл","Сходящаяся / расходящаяся, примеры"],
say:`<p>Неравенство |xₙ − a| < ε равносильно a − ε < xₙ < a + ε, то есть xₙ лежит в интервале (a − ε; a + ε) — <b>ε-окрестности</b> точки a.</p>
<p><b>Геометрический смысл:</b> a — предел, если в любой ε-окрестности точки a лежат все члены последовательности, начиная с некоторого номера; вне окрестности — лишь конечное число членов.</p>
<p>Чем меньше ε, тем больше N, но внутри любой ε-окрестности всегда бесконечно много членов, а вне — конечное число. Отсюда: <b>сходящаяся последовательность имеет только один предел</b>. <b>Сходящаяся</b> — имеет предел; <b>расходящаяся</b> — не имеет.</p>
<p>Примеры: 1/n → 0 (сходится); xₙ = n → ∞ (расходится); (−1)ⁿ = −1, 1, −1, … — предела нет (расходится).</p>`,
qa:[["Почему (−1)ⁿ расходится, хотя ограничена?","При ε = 1/2 никакая окрестность длины 1 не вмещает одновременно −1 и 1."],["Связь сходимости и ограниченности?","Сходящаяся ⇒ ограничена. Обратное неверно: (−1)ⁿ."]]},
{id:"2.3",ref:"§15.3, с. 130",t:"Теорема о предельном переходе в неравенствах",
plan:["Теорема 15.1: xₙ ≤ yₙ ⇒ a ≤ b","Доказательство от противного, ε = (a − b)/2","Строгое → нестрогое","Теорема 15.2 (о промежуточной последовательности)"],
say:`<p><b>Теорема 15.1.</b> Если lim xₙ = a, lim yₙ = b и, начиная с некоторого номера, выполняется неравенство xₙ ≤ yₙ, то a ≤ b.</p>
<p><b>Замечание:</b> строгое неравенство может перейти в нестрогое: 1/n > 0, но lim 1/n = 0. Частный случай: если xₙ ≥ b (b — число), то lim xₙ ≥ b.</p>
<p><b>Теорема 15.2</b> (без доказательства): если lim xₙ = a, lim yₙ = a и xₙ ≤ zₙ ≤ yₙ (начиная с некоторого номера), то lim zₙ = a.</p>`,
proof:`<p>Допустим, что a > b. Для любого ε > 0 найдётся N, что при n > N: a − ε < xₙ < a + ε и b − ε < yₙ < b + ε. Возьмём ε = (a − b)/2. Тогда xₙ > a − ε = (a + b)/2, а yₙ < b + ε = (a + b)/2, т. е. yₙ < xₙ — противоречие с условием xₙ ≤ yₙ. Следовательно, a ≤ b. ∎</p>`,
qa:[["Почему ε = (a − b)/2?","Это половина расстояния между a и b: окрестности радиуса ε вокруг a и b не пересекаются, точка (a + b)/2 их разделяет."],["Почему название такое?","«Предельный переход» — переход к пределу в обеих частях неравенства."]]},
{id:"2.4",ref:"§15.4, с. 130–132",t:"Теорема о монотонной ограниченной последовательности (теорема Вейерштрасса). Число е",
plan:["Формулировка","Доказательство через sup","xₙ = (1 + 1/n)ⁿ: возрастает","Ограничена: 2 ≤ xₙ < 3","e = lim (1 + 1/n)ⁿ ≈ 2,718"],
say:`<p><b>Теорема Вейерштрасса.</b> Всякая монотонная ограниченная последовательность имеет предел.</p>
<p><b>Число e.</b> Рассмотрим xₙ = (1 + 1/n)ⁿ. По биному Ньютона:<br>xₙ = 1 + 1 + (1/2!)(1 − 1/n) + (1/3!)(1 − 1/n)(1 − 2/n) + … + (1/n!)(1 − 1/n)…(1 − (n−1)/n).</p>
<ul><li><b>Возрастает:</b> с ростом n скобки (1 − k/n) растут и добавляются новые положительные слагаемые.</li>
<li><b>Ограничена:</b> скобки < 1, поэтому xₙ < 2 + 1/2! + … + 1/n! < 2 + 1/2 + 1/4 + … + 1/2ⁿ⁻¹ < 3.</li></ul>
<p>По теореме Вейерштрасса предел существует: <b>e = lim (1 + 1/n)ⁿ ≈ 2,718</b> — неперово число, иррациональное. Логарифм по основанию e — натуральный: ln x. Связь с десятичным: lg x ≈ 0,4343·ln x, ln x ≈ 2,3026·lg x.</p><p class="note">У Письменного теорема Вейерштрасса дана без доказательства; доказательство ниже — дополнительно, если спросят.</p>`,
proof:`<p>Пусть {xₙ} возрастает и ограничена сверху. Тогда существует a = sup{xₙ}. Для любого ε > 0 число a − ε уже не верхняя граница ⇒ ∃N: x_N > a − ε. Последовательность возрастает ⇒ при n > N: a − ε < x_N ≤ xₙ ≤ a. Значит |xₙ − a| < ε, т. е. lim xₙ = a. ∎</p>`,
qa:[["Почему 1/k! ≤ 1/2ᵏ⁻¹?","k! = 1·2·3·…·k ≥ 1·2·2·…·2 = 2ᵏ⁻¹."],["Нужны ли оба условия?","Да: (−1)ⁿ ограничена, но не монотонна — предела нет; n монотонна, но не ограничена."]]},
{id:"3.1",ref:"§16.1, с. 132–134",t:"Предел функции в точке: определение по Гейне, определение по Коши. Геометрический смысл определения предела функции в точке",
plan:["f определена в окрестности x₀ (кроме, быть может, x₀)","По Гейне — через последовательности","По Коши — ε–δ","Эквивалентны","Геометрический смысл: полосы"],
say:`<p>Пусть f(x) определена в некоторой окрестности x₀, кроме, быть может, самой x₀.</p>
<p><b>По Гейне:</b> A — предел f(x) в точке x₀, если для <b>любой</b> последовательности xₙ → x₀ (xₙ ≠ x₀) последовательность f(xₙ) → A.</p>
<p><b>По Коши:</b> A — предел f(x) в точке x₀, если ∀ε > 0 ∃δ > 0 такое, что для всех x: 0 < |x − x₀| < δ выполняется |f(x) − A| < ε. Пишут lim (x→x₀) f(x) = A. Определения эквивалентны.</p>
<p><b>Геометрический смысл:</b> для любой ε-полосы вокруг прямой y = A найдётся δ-окрестность x₀, в которой (при x ≠ x₀) все точки графика лежат между прямыми y = A − ε и y = A + ε.</p>`,
qa:[["Зачем x ≠ x₀?","Предел описывает поведение рядом с точкой; в самой точке функция может быть не определена (sin x/x в нуле)."],["Как доказать, что предела нет?","По Гейне: найти две последовательности xₙ → x₀ с разными пределами f(xₙ)."],["x₀ и A — что где?","x₀ — куда стремится аргумент (под lim), A — куда стремятся значения (после =)."]]},
{id:"3.2",ref:"§16.2, с. 134–135",t:"Односторонние пределы функции в точке",
plan:["Предел слева","Предел справа","Теорема: предел ⇔ односторонние равны","Пример sign x"],
say:`<p><b>Предел слева:</b> A₁ = lim (x→x₀−0) f(x), если ∀ε > 0 ∃δ > 0: при x ∈ (x₀ − δ; x₀) выполняется |f(x) − A₁| < ε.</p>
<p><b>Предел справа:</b> A₂ = lim (x→x₀+0) f(x), если ∀ε > 0 ∃δ > 0: при x ∈ (x₀; x₀ + δ) выполняется |f(x) − A₂| < ε.</p>
<p><b>Теорема.</b> lim (x→x₀) f(x) = A ⇔ существуют оба односторонних предела и A₁ = A₂ = A.</p>
<p><b>Пример:</b> sign x в нуле: слева −1, справа 1 ⇒ предела нет.</p>`,
proof:`<p><b>⇒</b> Если |f(x) − A| < ε при 0 < |x − x₀| < δ, то это верно и при x ∈ (x₀ − δ; x₀), и при x ∈ (x₀; x₀ + δ).</p><p><b>⇐</b> Слева есть δ₁, справа δ₂. Берём δ = min(δ₁, δ₂) — тогда |f(x) − A| < ε при 0 < |x − x₀| < δ. ∎</p>`,
qa:[["Что значит x₀ − 0?","Не вычитание, а обозначение: подходим к x₀ слева."],["Где пригодится?","Классификация точек разрыва (5.2)."]]},
{id:"3.3",ref:"§16.3, с. 135",t:"Предел функции при х→∞. Геометрический смысл предела функции при х→∞",
plan:["Определение (ε–M)","x → +∞ и x → −∞","Геометрический смысл","Примеры, связь с горизонтальной асимптотой"],
say:`<p><b>Определение.</b> A — предел f(x) при x → ∞, если ∀ε > 0 ∃M > 0 такое, что при |x| > M выполняется |f(x) − A| < ε. Для x → +∞ условие x > M, для x → −∞ — x < −M.</p>
<p><b>Геометрический смысл:</b> для любой ε-полосы вокруг y = A найдётся M, что при |x| > M график лежит в этой полосе.</p>
<p>Примеры: lim 1/x = 0; lim (x→+∞) arctg x = π/2, lim (x→−∞) arctg x = −π/2. Если lim = A, то y = A — горизонтальная асимптота.</p>`,
qa:[["Чем отличается от предела в точке?","Вместо |x − x₀| < δ условие |x| > M."],["Пример функции без предела при x → ∞?","sin x — колеблется."]]},
{id:"3.4",ref:"§16.4, с. 135–136",t:"Бесконечно большая функция (ббф). Примеры ббф. Ограниченность ббф",
plan:["Определение","+∞ и −∞","Примеры","ббф не ограничена; обратное неверно"],
say:`<p><b>Определение.</b> f(x) — бесконечно большая при x → x₀, если ∀M > 0 ∃δ > 0: при 0 < |x − x₀| < δ выполняется |f(x)| > M. Пишут lim f(x) = ∞ (если f > M — то +∞, если f < −M — то −∞). Аналогично при x → ∞: |f(x)| > M при |x| > N.</p>
<p><b>Примеры:</b> 1/x² при x → 0 (+∞); 1/x при x → 0+0 (+∞) и x → 0−0 (−∞); x², eˣ при x → +∞; ln x при x → 0+0 (−∞).</p>
<p>Пример Письменного: y = 1/(x − 2) — ббф при x → 2. Если же lim f(x) = A конечен, то f ограничена в окрестности x₀.</p><p><b>Ограниченность:</b> ббф не ограничена в окрестности x₀. Обратное неверно: x·sin x при x → ∞ не ограничена, но не ббф — в точках x = πk она равна 0.</p>`,
qa:[["Является ли ∞ числом?","Нет. Запись lim = ∞ означает неограниченный рост модуля; предела-числа нет."],["Связь с вертикальной асимптотой?","Если lim (x→x₀) f = ∞, то x = x₀ — вертикальная асимптота."]]},
{id:"3.5",ref:"§17.1, теорема 17.1, с. 136–137",t:"Бесконечно малая функция (бмф). Примеры бмф. Теорема об алгебраической сумме конечного числа бмф",
plan:["Определение бмф","Примеры","Теорема о сумме","Доказательство через ε/2"],
say:`<p><b>Определение.</b> α(x) — бесконечно малая при x → x₀, если lim (x→x₀) α(x) = 0, т. е. ∀ε > 0 ∃δ > 0: при 0 < |x − x₀| < δ выполняется |α(x)| < ε.</p>
<p><b>Примеры:</b> sin x при x → 0; 1/x при x → ∞; (x − 1)² при x → 1.</p>
<p><b>Теорема.</b> Алгебраическая сумма конечного числа бмф есть бмф.</p>`,
proof:`<p>Пусть α, β → 0 при x → x₀. Возьмём ε > 0. ∃δ₁: |α| < ε/2; ∃δ₂: |β| < ε/2. При δ = min(δ₁, δ₂): |α ± β| ≤ |α| + |β| < ε/2 + ε/2 = ε. Значит α ± β — бмф. Для n слагаемых — аналогично (или по индукции). ∎</p>`,
qa:[["Верно ли для бесконечного числа слагаемых?","Нет. Например, n слагаемых по 1/n дают 1 при n → ∞."],["Является ли 0,000001 бмф?","Нет, бмф — функция, стремящаяся к нулю, а не маленькое число. Единственная постоянная бмф — 0."]]},
{id:"3.6",ref:"§17.1, теорема 17.2, с. 137–138",t:"Теорема о произведении ограниченной функции на бмф",
plan:["Формулировка","Доказательство через ε/M","Следствия","Пример x·sin(1/x)"],
say:`<p><b>Теорема.</b> Произведение функции, ограниченной в окрестности x₀, на бмф при x → x₀ есть бмф.</p>
<p><b>Следствия:</b> произведение бмф на число — бмф; произведение двух бмф — бмф (бмф ограничена, так как имеет предел).</p>
<p><b>Пример:</b> lim (x→0) x·sin(1/x) = 0: |sin(1/x)| ≤ 1, x → 0.</p>`,
proof:`<p>|f(x)| ≤ M в окрестности x₀; α → 0 ⇒ для любого ε > 0 ∃δ: |α(x)| < ε/M. Тогда |f·α| = |f|·|α| < M·ε/M = ε. ∎</p>`,
qa:[["Почему бмф ограничена?","Функция, имеющая конечный предел, ограничена в окрестности точки."]]},
{id:"3.7",ref:"§17.1, теорема 17.3, с. 138–139",t:"Теорема о частном от деления бмф на функцию, имеющую предел отличный от нуля",
plan:["Формулировка","1/f ограничена","Свести к 3.6"],
say:`<p><b>Теорема.</b> Частное от деления бмф α(x) на функцию f(x), имеющую предел a ≠ 0, есть бмф.</p>`,
proof:`<p>α/f = α·(1/f). Так как f → a ≠ 0, для ε = |a|/2 ∃δ: |f(x) − a| < |a|/2 ⇒ |f(x)| > |a|/2 ⇒ |1/f| < 2/|a| — функция 1/f ограничена. Произведение бмф на ограниченную — бмф (3.6). ∎</p>`,
qa:[["Зачем предел ≠ 0?","Иначе 1/f может быть неограниченной: α = x, f = x² ⇒ α/f = 1/x → ∞."]]},
{id:"3.8",ref:"§17.1, теорема 17.4, с. 139",t:"Теорема о связи между ббф и бмф",
plan:["Формулировка в обе стороны","Доказательство: M = 1/ε"],
say:`<p><b>Теорема.</b> Если f(x) — ббф при x → x₀, то 1/f(x) — бмф. Если α(x) — бмф и α(x) ≠ 0, то 1/α(x) — ббф.</p>
<p>Пример: x → 0: x — бмф, 1/x — ббф.</p>`,
proof:`<p>1) f → ∞: для любого ε > 0 возьмём M = 1/ε: ∃δ: |f| > 1/ε ⇒ |1/f| < ε.</p><p>2) α → 0: для любого M > 0 возьмём ε = 1/M: ∃δ: |α| < 1/M ⇒ |1/α| > M. ∎</p>`,
qa:[["Зачем α ≠ 0?","Иначе 1/α не определена."]]},
{id:"3.9",ref:"§17.2, теоремы 17.5–17.6, с. 140",t:"Теорема о связи между функцией, ее пределом и бмф и обратная к ней",
plan:["Прямая: f = A + α","Обратная","Доказательство — одной строкой"],
say:`<p><b>Теорема.</b> Если lim (x→x₀) f(x) = A, то f(x) = A + α(x), где α — бмф при x → x₀.</p>
<p><b>Обратная.</b> Если f(x) = A + α(x), где α — бмф, то lim f(x) = A.</p>
<p>Эта теорема — главный инструмент для доказательств теорем 3.10–3.12.</p>`,
proof:`<p>Обозначим α = f − A. lim f = A ⇔ |f(x) − A| < ε ⇔ |α(x)| < ε ⇔ α → 0. Обе части сразу. ∎</p>`,
qa:[["Зачем нужна?","Сводит пределы к бмф: f = A + α, g = B + β — так доказывают теоремы о пределах суммы, произведения, частного."]]},
{id:"3.10",ref:"§17.3, теорема 17.7, с. 141",t:"Основные теоремы о пределах (теорема о пределе суммы (разности) двух функций с доказательством)",
plan:["Формулировка","f = A + α, g = B + β","Сумма бмф — бмф","Обратная теорема 3.9"],
say:`<p><b>Теорема 17.7.</b> Если существуют lim f(x) = A и lim g(x) = B, то lim (f ± g) = A ± B. Верна для любого конечного числа слагаемых.</p><p><b>Следствие 17.3.</b> Функция может иметь только один предел: если lim f = A и lim f = B, то 0 = lim (f − f) = A − B, т. е. A = B.</p>`,
proof:`<p>По 3.9: f = A + α, g = B + β, α, β — бмф. Тогда f ± g = (A ± B) + (α ± β). α ± β — бмф (3.5). По обратной теореме 3.9 lim (f ± g) = A ± B. ∎</p>`,
qa:[["Верно ли для любого конечного числа слагаемых?","Да."],["А если пределов нет?","Сумма может иметь предел: sin(1/x) + (−sin(1/x)) = 0."]]},
{id:"3.11",ref:"§17.3, теорема 17.8, с. 141–142",t:"Основные теоремы о пределах (теорема о пределе произведения двух функций с доказательством). Следствия из теоремы о пределе двух функций",
plan:["Формулировка","(A + α)(B + β)","Скобка — бмф","Следствия: константа, степень"],
say:`<p><b>Теорема.</b> Если lim f = A, lim g = B, то lim (f·g) = A·B.</p>
<p><b>Следствия:</b> lim (c·f) = c·lim f — постоянный множитель выносится; lim fⁿ = (lim f)ⁿ.</p>`,
proof:`<p>f·g = (A + α)(B + β) = AB + (Aβ + Bα + αβ). Aβ, Bα — бмф (3.6), αβ — бмф, сумма — бмф (3.5). По 3.9 lim fg = AB. ∎</p>`,
qa:[["Почему Aβ — бмф?","Константа ограничена, а произведение ограниченной на бмф — бмф."]]},
{id:"3.12",ref:"§17.3, теорема 17.9, с. 142–143",t:"Основные теоремы о пределах (теорема о пределе частного двух функций с доказательством)",
plan:["Формулировка, B ≠ 0","f/g − A/B = (Bα − Aβ)/(B(B + β))","Числитель — бмф, знаменатель → B²","Теорема 3.7"],
say:`<p><b>Теорема.</b> Если lim f = A, lim g = B ≠ 0, то lim f/g = A/B.</p>`,
proof:`<p>f/g − A/B = (A + α)/(B + β) − A/B = (Bα − Aβ)/(B(B + β)). Числитель — бмф (3.5, 3.6). Знаменатель B(B + β) → B² ≠ 0. По 3.7 дробь — бмф. Значит f/g = A/B + бмф, и по 3.9 lim f/g = A/B. ∎</p>`,
qa:[["Что если B = 0?","Теорема не применима: получается неопределённость 0/0 или ∞ — нужны другие приёмы."]]},
{id:"3.13",ref:"§17.4, теоремы 17.10–17.11, с. 144–145",t:"Признаки существования пределов. Теорема о пределе промежуточной функции или «теорема о милиционерах». Теорема о пределе монотонной функции",
plan:["φ ≤ f ≤ g, φ → A, g → A ⇒ f → A","Доказательство через ε","Предел монотонной функции"],
say:`<p><b>Теорема о двух милиционерах.</b> Если в окрестности x₀ φ(x) ≤ f(x) ≤ g(x) и lim φ = lim g = A, то lim f = A.</p>
<p><b>Теорема о пределе монотонной функции.</b> Если f монотонна и ограничена при x < x₀ (или x > x₀), то существует её левый (правый) предел в x₀. (Без доказательства.) <b>Следствие 17.6:</b> ограниченная монотонная последовательность имеет предел.</p>`,
proof:`<p>Для ε > 0: ∃δ₁: A − ε < φ(x) < A + ε; ∃δ₂: A − ε < g(x) < A + ε. При δ = min(δ₁, δ₂): A − ε < φ ≤ f ≤ g < A + ε ⇒ |f − A| < ε. ∎</p>`,
qa:[["Где применяется?","В доказательстве первого и второго замечательных пределов."]]},
{id:"3.14",ref:"§17.5, с. 145–146",t:"Первый замечательный предел",
plan:["lim (x→0) sin x / x = 1","Единичная окружность, 0 < x < π/2","S△ < S сектора < S△","cos x < sin x/x < 1, милиционеры","Чётность → x < 0","Следствия"],
say:`<p><b>lim (x→0) sin x / x = 1.</b></p>
<p><b>Следствия:</b> lim tg x/x = 1, lim arcsin x/x = 1, lim arctg x/x = 1.</p>`,
proof:`<p>Единичная окружность, угол x (0 < x < π/2), точки O, A (на окружности), B (на оси), C (на касательной). Площади: S△OAB < S сектора OAB < S△OCB, то есть ½sin x < ½x < ½tg x.</p><p>Делим на ½sin x > 0: 1 < x/sin x < 1/cos x ⇒ cos x < sin x/x < 1. При x → 0 cos x → 1, по теореме о милиционерах предел равен 1. Функция sin x/x чётная ⇒ при x → 0−0 то же самое. ∎</p>`,
qa:[["Почему функция чётная?","sin(−x)/(−x) = sin x/x."],["Найди lim sin 5x / x.","5·(sin 5x/5x) → 5."]]},
{id:"3.15",ref:"§17.6, с. 146–147",t:"Второй замечательный предел",
plan:["lim (x→∞)(1 + 1/x)ˣ = e; lim (x→0)(1 + x)^(1/x) = e","Знаем для n (2.4)","n ≤ x < n + 1, оценка","Милиционеры","x → −∞ заменой","Следствия"],
say:`<p><b>lim (x→∞) (1 + 1/x)ˣ = e</b>, или <b>lim (x→0) (1 + x)^(1/x) = e</b>. Неопределённость 1^∞.</p>
<p><b>Следствия:</b> lim ln(1 + x)/x = 1; lim (eˣ − 1)/x = 1; lim (aˣ − 1)/x = ln a.</p>`,
proof:`<p>x → +∞: n = [x], n ≤ x < n + 1 ⇒ (1 + 1/(n+1))ⁿ < (1 + 1/x)ˣ < (1 + 1/n)ⁿ⁺¹.</p><p>(1 + 1/n)ⁿ⁺¹ = (1 + 1/n)ⁿ·(1 + 1/n) → e·1; (1 + 1/(n+1))ⁿ = (1 + 1/(n+1))ⁿ⁺¹ / (1 + 1/(n+1)) → e/1. По милиционерам — e.</p><p>x → −∞: замена x = −(t + 1), t → +∞, получаем (1 + 1/t)ᵗ⁺¹ → e. Вторая форма — замена x = 1/t. ∎</p>`,
qa:[["Найди lim (1 + 2/x)ˣ.","[(1 + 2/x)^(x/2)]² → e²."]]},
{id:"4.1",ref:"§18.1, с. 148–149",t:"Сравнение бмф: определения, примеры",
plan:["α, β — бмф при x → x₀, смотрим lim α/β","Одного порядка, высшего, низшего","Порядок k","Несравнимые","Примеры"],
say:`<p>Пусть α, β — бмф при x → x₀. Рассматриваем lim α/β:</p>
<ul><li>= A ≠ 0 (конечное) — <b>одного порядка</b>;</li>
<li>= 0 — α <b>более высокого порядка</b>, чем β: α = o(β);</li>
<li>= ∞ — α более низкого порядка;</li>
<li>lim α/βᵏ = A ≠ 0 — α <b>порядка k</b> относительно β;</li>
<li>не существует — <b>несравнимые</b>.</li></ul>
<p>Примеры (x → 0): x² = o(x); sin 2x и x — одного порядка (→ 2); 1 − cos x — второго порядка относительно x (→ 1/2); x·sin(1/x) и x — несравнимы.</p>`,
qa:[["Что значит «более высокого порядка»?","α стремится к нулю быстрее, чем β."]]},
{id:"4.2",ref:"§18.2, теорема 18.1, с. 149",t:"Эквивалентные бмф. Теорема о пределе отношения двух бмф",
plan:["α ~ β ⇔ lim α/β = 1","Теорема о замене","Доказательство: три множителя","Пример"],
say:`<p><b>Эквивалентные:</b> α ~ β, если lim α/β = 1.</p>
<p><b>Теорема.</b> Предел отношения двух бмф не изменится, если каждую заменить эквивалентной: α ~ α₁, β ~ β₁ ⇒ lim α/β = lim α₁/β₁.</p>
<p><b>Пример:</b> lim sin 3x / tg 5x = lim 3x/5x = 3/5.</p>`,
proof:`<p>α/β = (α/α₁)·(α₁/β₁)·(β₁/β). При x → x₀ первый и третий множители → 1. Значит lim α/β = lim α₁/β₁. ∎</p>`,
qa:[["Можно ли заменять в сумме?","Как правило нет — только в произведении и частном."]]},
{id:"4.3",ref:"§18.2, теорема 18.2, с. 150",t:"Эквивалентные бмф. Теорема о разности двух эквивалентных бмф",
plan:["α ~ β ⇔ α − β = o(α) и o(β)","Доказательство в обе стороны"],
say:`<p><b>Теорема.</b> Для того чтобы бмф α и β были эквивалентны, необходимо и достаточно, чтобы их разность была бмф более высокого порядка, чем каждая из них.</p>`,
proof:`<p>⇒ lim (α − β)/α = lim (1 − β/α) = 1 − 1 = 0, аналогично для β.</p><p>⇐ lim (α − β)/α = 0 ⇒ 1 − lim β/α = 0 ⇒ lim β/α = 1. ∎</p>`,
qa:[["Пример?","sin x ~ x, разность x − sin x ~ x³/6 — третьего порядка."]]},
{id:"4.4",ref:"§18.2, теорема 18.3, с. 150",t:"Эквивалентные бмф. Теорема о сумме конечного числа бмф разных порядков. Понятие, вытекающие из данной теоремы",
plan:["Сумма ~ слагаемому низшего порядка","Доказательство для двух","Главная часть бмф","Пример"],
say:`<p><b>Теорема.</b> Сумма конечного числа бмф разных порядков эквивалентна слагаемому низшего порядка.</p>
<p><b>Понятие:</b> это слагаемое называется <b>главной частью</b> суммы; замену суммы её главной частью называют отбрасыванием бмф высших порядков.</p>
<p><b>Пример:</b> x + 3x² + x³ ~ x при x → 0; lim (3x + x²)/sin x = 3.</p>`,
proof:`<p>Для двух: β = o(α). (α + β)/α = 1 + β/α → 1 + 0 = 1 ⇒ α + β ~ α. ∎</p>`,
qa:[["Что такое главная часть бмф?","Если α ~ c·βᵏ, то c·βᵏ — главная часть α."]]},
{id:"4.5",ref:"§18.3, с. 151–153",t:"Применение эквивалентных бмф. Таблица эквивалентных бмф. Геометрический смысл",
plan:["Таблица при x → 0","Применение в пределах","Когда нельзя заменять","Геометрический смысл"],
say:`<p><b>Таблица (x → 0):</b> sin x ~ x; tg x ~ x; arcsin x ~ x; arctg x ~ x; 1 − cos x ~ x²/2; eˣ − 1 ~ x; aˣ − 1 ~ x·ln a; ln(1 + x) ~ x; logₐ(1 + x) ~ x/ln a; (1 + x)ᵏ − 1 ~ kx; √(1 + x) − 1 ~ x/2.</p>
<p><b>Применение:</b> в пределах отношений и произведений бмф заменяем эквивалентными. Пример: lim (1 − cos 4x)/(x·sin 2x) = (8x²)/(2x²) = 4.</p>
<p><b>Приближённые вычисления:</b> если α ~ β, то α ≈ β (отбрасываем бмф высшего порядка). Пример: ln 1,032 = ln(1 + 0,032) ≈ 0,032 (точно 0,0315…).</p><p><b>Геометрический смысл:</b> sin x ~ x — вблизи нуля график y = sin x почти сливается с прямой y = x (касательной в нуле); то же для tg x, eˣ − 1, ln(1 + x).</p>`,
qa:[["Почему нельзя заменять в разности?","Главные части могут сократиться: tg x − sin x ~ x³/2, а замена даёт x − x = 0."],["Откуда таблица?","Из замечательных пределов и их следствий."]]},
{id:"5.1",ref:"§19.1–19.2, с. 153–155",t:"Непрерывность функции в точке, на интервале и на отрезке",
plan:["Определение: lim f = f(x₀)","Через приращения: Δy → 0","Три условия","На интервале и на отрезке (односторонняя непрерывность)"],
say:`<p><b>Определение.</b> f(x) непрерывна в точке x₀, если она определена в окрестности x₀ (включая x₀) и lim (x→x₀) f(x) = f(x₀).</p>
<p><b>Через приращения:</b> Δy = f(x₀ + Δx) − f(x₀); f непрерывна ⇔ lim (Δx→0) Δy = 0.</p>
<p>Три условия: f определена в x₀; существует конечный предел; предел равен f(x₀).</p>
<p><b>На интервале</b> (a; b) — непрерывна в каждой его точке. <b>На отрезке</b> [a; b] — непрерывна на (a; b), в точке a непрерывна справа (lim (x→a+0) f = f(a)), в точке b — слева.</p>`,
qa:[["Смысл Δy → 0?","Малое изменение аргумента даёт малое изменение функции — график без разрывов."]]},
{id:"5.2",ref:"§19.3, с. 155–157",t:"Точки разрыва функции",
plan:["Определение","I рода: устранимый, скачок","II рода","Примеры"],
say:`<p><b>Точка разрыва</b> — точка, в которой функция не является непрерывной.</p>
<ul><li><b>I рода:</b> оба односторонних предела конечны.<br>— <b>устранимый</b>: f(x₀ − 0) = f(x₀ + 0), но f не определена в x₀ или ≠ этому числу (sin x/x в нуле);<br>— <b>скачок</b>: f(x₀ − 0) ≠ f(x₀ + 0); величина скачка |f(x₀ + 0) − f(x₀ − 0)| (sign x в нуле).</li>
<li><b>II рода:</b> хотя бы один односторонний предел бесконечен или не существует (1/x в нуле; sin(1/x) в нуле).</li></ul>`,
qa:[["Почему «устранимый»?","Достаточно доопределить f(x₀) значением предела — функция станет непрерывной."]]},
{id:"5.3",ref:"§19.4, теоремы 19.1–19.3, с. 158–159",t:"Теорема о сумме, произведении и частном двух непрерывных функций. Теорема о непрерывности сложной функции. Теорема о непрерывности обратной функции",
plan:["f ± g, f·g, f/g — из теорем о пределах","Сложная функция","Обратная функция","Вывод: элементарные функции непрерывны"],
say:`<p><b>Теорема 1.</b> Если f и g непрерывны в x₀, то f ± g, f·g и f/g (g(x₀) ≠ 0) непрерывны в x₀.<br>Доказательство: lim (f + g) = lim f + lim g = f(x₀) + g(x₀) — по теоремам о пределах; аналогично для произведения и частного.</p>
<p><b>Теорема 2 (сложная).</b> Если u = φ(x) непрерывна в x₀, а y = f(u) непрерывна в u₀ = φ(x₀), то f(φ(x)) непрерывна в x₀.<br>Доказательство: при x → x₀ u → u₀, значит f(u) → f(u₀): lim f(φ(x)) = f(φ(x₀)).</p>
<p><b>Теорема 3 (обратная).</b> Если y = f(x) непрерывна и строго монотонна на [a; b], то обратная функция существует, непрерывна и монотонна на соответствующем отрезке (без доказательства).</p>
<p><b>Следствие:</b> все элементарные функции непрерывны в своей области определения.</p>`,
qa:[["Как переносить знак предела в сложной функции?","Для непрерывной f: lim f(φ(x)) = f(lim φ(x))."]]},
{id:"5.4",ref:"§19.5, теорема 19.4, с. 159",t:"Теорема Вейерштрасса (о непрерывной функции на отрезке). Следствие теоремы",
plan:["Формулировка","Следствие: ограничена","Почему нужен отрезок и непрерывность"],
say:`<p><b>Теорема Вейерштрасса.</b> Если f непрерывна на отрезке [a; b], то она достигает на нём своего наибольшего и наименьшего значений.</p>
<p><b>Следствие.</b> Непрерывная на отрезке функция ограничена на нём.</p>
<p>Условия важны: на интервале (0; 1) функция 1/x непрерывна, но не ограничена; разрывная функция на отрезке может не достигать максимума.</p>`,
qa:[["Пример, где на интервале нет max?","y = x на (0; 1): значения подходят к 1, но не достигают."]]},
{id:"5.5",ref:"§19.5, теорема 19.5, с. 160–161",t:"Теорема Больцано-Коши (о непрерывной функции на отрезке). Следствие теоремы",
plan:["Теорема 19.5: все промежуточные значения","Геометрический смысл: прямая y = C пересекает график","Следствие 19.2: значения разных знаков ⇒ есть нуль","Метод половинного деления","Условия существенны"],
say:`<p><b>Теорема 19.5 (Больцано–Коши).</b> Если функция y = f(x) непрерывна на отрезке [a; b] и принимает на его концах неравные значения f(a) = A и f(b) = B, то на этом отрезке она принимает и все промежуточные значения между A и B: для любого C между A и B найдётся c ∈ (a; b), что f(c) = C. Геометрически: прямая y = C пересекает график хотя бы в одной точке. (Без доказательства.)</p>
<p><b>Следствие 19.2.</b> Если f непрерывна на [a; b] и на концах принимает значения разных знаков, то найдётся хотя бы одна точка c ∈ (a; b), в которой f(c) = 0. Геометрически: если график непрерывной функции переходит с одной стороны оси Ox на другую, он пересекает ось Ox.</p>
<p>Если нарушить условия (интервал вместо отрезка или разрыв), утверждения могут быть неверны.</p>
<p><b>Пример:</b> x³ + x − 1 на [0; 1]: f(0) = −1, f(1) = 1 ⇒ есть корень. На этом основан метод половинного деления.</p>`,
qa:[["Как получить следствие из теоремы?","Применить теорему к g(x) = f(x) − C."]]},
{id:"6.1",ref:"§20.1–20.2, с. 161–165",t:"Определение производной, геометрический и механический смыслы производной",
plan:["Приращения Δx, Δy","f′(x₀) = lim Δy/Δx","Геометрический: tg α","Механический: скорость","Дифференцируемость"],
say:`<p><b>Задачи, приводящие к производной:</b> мгновенная скорость v = lim ΔS/Δt и угловой коэффициент касательной k = lim Δy/Δx (также сила тока, скорость реакции, линейная плотность) — везде предел отношения приращения функции к приращению аргумента.</p><p><b>Производная</b> функции y = f(x) в точке x₀ — предел отношения приращения функции к приращению аргумента при Δx → 0:<br>f′(x₀) = lim (Δx→0) Δy/Δx = lim (f(x₀ + Δx) − f(x₀))/Δx.</p>
<p>Если предел конечен, функция <b>дифференцируема</b> в точке; нахождение производной — <b>дифференцирование</b>.</p>
<p><b>Геометрический смысл:</b> f′(x₀) = tg α — угловой коэффициент касательной к графику в точке x₀.</p>
<p><b>Механический смысл:</b> если s = s(t) — путь, то s′(t) = v(t) — мгновенная скорость. <b>Физический смысл:</b> если f описывает процесс, то f′ — скорость протекания процесса.</p>`,
qa:[["Пример по определению: (x²)′.","Δy = 2xΔx + Δx², Δy/Δx = 2x + Δx → 2x."]]},
{id:"6.2",ref:"§20.2, с. 165–166",t:"Геометрический смысл производной. Уравнения касательной и нормали к графику функции",
plan:["Секущая, tg φ = Δy/Δx","Предельное положение — касательная","Уравнение касательной","Уравнение нормали","Пример"],
say:`<p>Секущая через M₀(x₀; y₀) и M(x₀ + Δx; y₀ + Δy) имеет угловой коэффициент tg φ = Δy/Δx. При Δx → 0 M → M₀, секущая переходит в <b>касательную</b>, и tg φ → tg α = f′(x₀).</p>
<p><b>Касательная:</b> y − y₀ = f′(x₀)(x − x₀).</p>
<p><b>Нормаль</b> (перпендикуляр к касательной в точке касания): y − y₀ = −(1/f′(x₀))(x − x₀), при f′(x₀) ≠ 0; если f′(x₀) = 0, нормаль x = x₀.</p>
<p><b>Пример:</b> y = x², x₀ = 1: касательная y = 2x − 1, нормаль y = −x/2 + 3/2.</p>`,
qa:[["Почему у нормали коэффициент −1/k?","Условие перпендикулярности прямых: k₁·k₂ = −1."]]},
{id:"6.3",ref:"§20.3, теорема 20.1, с. 166",t:"Связь между непрерывностью и дифференцируемостью функции. Теорема о связи между непрерывностью и дифференцируемостью функции",
plan:["Теорема: дифференцируема ⇒ непрерывна","Доказательство","Обратное неверно: |x|"],
say:`<p><b>Теорема.</b> Если функция дифференцируема в точке x₀, то она непрерывна в этой точке.</p>
<p><b>Обратное неверно:</b> y = |x| непрерывна в нуле, но производной нет: слева Δy/Δx = −1, справа 1 (излом графика).</p>`,
proof:`<p>Существует lim Δy/Δx = f′(x). По теореме о связи функции, её предела и бмф: Δy/Δx = f′(x) + α, где α → 0 при Δx → 0. Отсюда Δy = f′(x)·Δx + α·Δx. При Δx → 0 получаем lim Δy = 0 — функция непрерывна. ∎</p><p>Для |x| в нуле односторонние производные: f′₋(0) = −1, f′₊(0) = 1; они различны, поэтому производной нет.</p>`,
qa:[["Что значит излом графика?","Односторонние производные различны — касательной в точке нет."]]},
{id:"6.4",ref:"§20.4, теорема 20.2, с. 167",t:"Правила дифференцирования. Теорема о производной суммы (разности) двух функций",
plan:["(u ± v)′ = u′ ± v′","Δy = Δu ± Δv","Делим на Δx, предел"],
say:`<p><b>Теорема.</b> Если u и v дифференцируемы, то (u ± v)′ = u′ ± v′.</p>`,
proof:`<p>y = u ± v. Δy = Δu ± Δv. Δy/Δx = Δu/Δx ± Δv/Δx. При Δx → 0 получаем y′ = u′ ± v′. ∎</p>`,
qa:[["Для скольких слагаемых верно?","Для любого конечного числа."]]},
{id:"6.5",ref:"§20.4, теорема 20.3, с. 167–168",t:"Правила дифференцирования. Теорема о производной произведении двух функций",
plan:["(uv)′ = u′v + uv′","Δy = Δu·v + u·Δv + Δu·Δv","Δv → 0 по 6.3","Следствие (cu)′ = cu′"],
say:`<p><b>Теорема.</b> (uv)′ = u′v + uv′.</p><p><b>Следствие:</b> (c·u)′ = c·u′.</p>`,
proof:`<p>Δy = (u + Δu)(v + Δv) − uv = Δu·v + u·Δv + Δu·Δv.</p><p>Δy/Δx = (Δu/Δx)·v + u·(Δv/Δx) + (Δu/Δx)·Δv. При Δx → 0: Δv → 0, так как v дифференцируема, а значит непрерывна (6.3). Получаем y′ = u′v + uv′. ∎</p>`,
qa:[["Почему Δv → 0?","Дифференцируемая функция непрерывна."]]},
{id:"6.6",ref:"§20.4, теорема 20.4, с. 168–169",t:"Правила дифференцирования. Теорема о производной частного двух функций",
plan:["(u/v)′ = (u′v − uv′)/v²","Δy = (vΔu − uΔv)/(v(v + Δv))","Делим на Δx, предел"],
say:`<p><b>Теорема.</b> Если v ≠ 0, то (u/v)′ = (u′v − uv′)/v².</p>`,
proof:`<p>Δy = (u + Δu)/(v + Δv) − u/v = (vΔu − uΔv)/(v(v + Δv)).</p><p>Δy/Δx = (v·Δu/Δx − u·Δv/Δx)/(v(v + Δv)). При Δx → 0 (Δv → 0) получаем (u′v − uv′)/v². ∎</p>`,
qa:[["Выведи (tg x)′.","(sin x/cos x)′ = (cos²x + sin²x)/cos²x = 1/cos²x."]]},
{id:"6.7",ref:"§20.5, теорема 20.5, с. 169–170",t:"Правила дифференцирования. Теорема о производной сложной функции",
plan:["y = f(u), u = φ(x)","y′ₓ = y′ᵤ·u′ₓ","Доказательство: Δy/Δx = (Δy/Δu)(Δu/Δx)","Пример"],
say:`<p><b>Теорема.</b> Если u = φ(x) дифференцируема в x, а y = f(u) — в соответствующей точке u, то сложная функция дифференцируема и y′ₓ = y′ᵤ·u′ₓ.</p>
<p><b>Пример:</b> (sin x²)′ = cos x²·2x.</p>`,
proof:`<p>По условию Δy/Δu → y′ᵤ, значит Δy = y′ᵤ·Δu + α·Δu, α → 0 при Δu → 0. Аналогично Δu = u′ₓ·Δx + β·Δx, β → 0 при Δx → 0. Подставляем: Δy = y′ᵤu′ₓΔx + y′ᵤβΔx + u′ₓαΔx + αβΔx. Делим на Δx и переходим к пределу (Δx → 0 ⇒ Δu → 0 ⇒ α → 0): y′ₓ = y′ᵤ·u′ₓ. ∎</p>`,
qa:[["Правило «цепочки» для трёх функций?","y = f(u(v(x))): y′ = f′(u)·u′(v)·v′(x)."]]},
{id:"6.8",ref:"§20.5, теорема 20.6, с. 170",t:"Правила дифференцирования. Теорема о производной обратной функции",
plan:["x′ᵧ = 1/y′ₓ","Доказательство","Пример: arcsin x"],
say:`<p><b>Теорема.</b> Если y = f(x) строго монотонна, дифференцируема и f′(x) ≠ 0, то обратная x = φ(y) дифференцируема и x′ᵧ = 1/y′ₓ.</p>
<p><b>Пример:</b> y = arcsin x ⇔ x = sin y, x′ᵧ = cos y ⇒ y′ = 1/cos y = 1/√(1 − sin²y) = 1/√(1 − x²).</p>`,
proof:`<p>Δx/Δy = 1/(Δy/Δx). При Δy → 0 и Δx → 0 (обратная функция непрерывна) ⇒ x′ᵧ = 1/y′ₓ. ∎</p>`,
qa:[["Геометрический смысл?","Касательные к взаимно обратным графикам образуют с осями углы α и π/2 − α: tg α·tg(π/2 − α) = 1."]]},
{id:"6.9",ref:"§21, с. 179–181",t:"Дифференцирование неявных и параметрически заданных функций. Примеры",
plan:["Неявная: дифференцируем F(x, y) = 0, y = y(x)","Пример окружности","Параметрическая: y′ₓ = y′ₜ/x′ₜ","Вывод и пример"],
say:`<p><b>Неявная функция</b> F(x, y) = 0: дифференцируем обе части по x, считая y функцией от x (по правилу сложной), и выражаем y′.<br>Пример: x² + y² = 1 ⇒ 2x + 2y·y′ = 0 ⇒ y′ = −x/y.</p>
<p><b>Параметрическая</b> x = x(t), y = y(t): <b>y′ₓ = y′ₜ / x′ₜ</b>.<br>Вывод: t = t(x) — обратная к x(t), y = y(t(x)) — сложная: y′ₓ = y′ₜ·t′ₓ = y′ₜ/x′ₜ.<br>Пример: x = cos t, y = sin t ⇒ y′ = cos t/(−sin t) = −ctg t.</p>`,
qa:[["Почему (y²)′ = 2y·y′?","y зависит от x — это сложная функция."]]},
{id:"6.10",ref:"§22, с. 181–182",t:"Логарифмическое дифференцирование, метод потенцирования. Примеры",
plan:["Когда: uᵛ и длинные произведения","ln y, затем дифференцировать","Пример xˣ","Потенцирование: uᵛ = e^(v ln u)"],
say:`<p><b>Логарифмическое дифференцирование:</b> для y = u(x)^v(x) (или произведений многих множителей) логарифмируем: ln y = v·ln u. Дифференцируем: y′/y = v′ln u + v·u′/u ⇒ y′ = uᵛ(v′ln u + v·u′/u).</p>
<p><b>Формула (22.1):</b> (uᵛ)′ = uᵛ·ln u·v′ + v·uᵛ⁻¹·u′ — правило: сумма производной как от показательной функции (u = const) и как от степенной (v = const).</p><p><b>Пример:</b> y = xˣ: ln y = x ln x; y′/y = ln x + 1 ⇒ y′ = xˣ(ln x + 1).</p>
<p><b>Метод потенцирования:</b> записываем uᵛ = e^(v·ln u) и дифференцируем как сложную показательную: y′ = e^(v ln u)·(v ln u)′ — тот же результат.</p>`,
qa:[["Что такое логарифмическая производная?","(ln y)′ = y′/y."]]},
{id:"6.11",ref:"§23.1–23.2, с. 182–183",t:"Производные высших порядков: понятия, определения. Механический смысл производной 2-го порядка",
plan:["y″ = (y′)′, y⁽ⁿ⁾ = (y⁽ⁿ⁻¹⁾)′","Примеры","Механический смысл: ускорение","Для параметрической функции"],
say:`<p><b>Производная второго порядка</b> — производная от первой: y″ = (y′)′. <b>n-го порядка:</b> y⁽ⁿ⁾ = (y⁽ⁿ⁻¹⁾)′.</p>
<p><b>Примеры:</b> (eˣ)⁽ⁿ⁾ = eˣ; (sin x)⁽ⁿ⁾ = sin(x + nπ/2); (x³)‴ = 6.</p>
<p><b>Механический смысл:</b> если s = s(t), то s″(t) = v′(t) = a(t) — ускорение.</p>
<p>Для параметрической функции: y″ₓₓ = (y′ₓ)′ₜ / x′ₜ.</p>`,
qa:[["Чему равна (xᵐ)⁽ᵐ⁾?","m!"]]},
{id:"6.12",ref:"§24.1–24.2, с. 185–187",t:"Дифференциал функции: определение, геометрический смысл",
plan:["Δy = f′(x)Δx + α·Δx","dy = f′(x)Δx — главная линейная часть","dx = Δx, dy = f′(x)dx","Геометрический смысл: приращение касательной"],
say:`<p>Если f дифференцируема, то Δy/Δx = f′(x) + α, где α → 0, т. е. <b>Δy = f′(x)Δx + α·Δx</b>. Второе слагаемое — бмф более высокого порядка, чем Δx.</p>
<p><b>Дифференциал</b> — главная, линейная относительно Δx часть приращения: <b>dy = f′(x)Δx</b>. Для y = x: dx = Δx, поэтому dy = f′(x)dx и f′(x) = dy/dx.</p>
<p><b>Геометрический смысл:</b> dy — приращение ординаты <b>касательной</b> при переходе от x к x + Δx, тогда как Δy — приращение ординаты графика.</p>`,
qa:[["Чем dy отличается от Δy?","На бмф высшего порядка α·Δx; при малых Δx Δy ≈ dy."]]},
{id:"6.13",ref:"§24.3, теорема 24.1, с. 187",t:"Теорема о дифференциалах суммы, произведения и частного двух функций",
plan:["Формулы","Доказательство через производные"],
say:`<p><b>Теорема.</b> dc = 0; d(u ± v) = du ± dv; d(uv) = v·du + u·dv; d(cu) = c·du; d(u/v) = (v·du − u·dv)/v².</p>`,
proof:`<p>d(uv) = (uv)′dx = (u′v + uv′)dx = v·(u′dx) + u·(v′dx) = v·du + u·dv. Остальные — так же, через соответствующие правила дифференцирования. ∎</p>`,
qa:[["Откуда берутся формулы?","dy = y′dx + правила производных 6.4–6.6."]]},
{id:"6.14",ref:"§24.3, теорема 24.2, с. 187–188",t:"Теорема о дифференциалах сложной функции",
plan:["dy = y′ₓdx = f′(u)φ′(x)dx = f′(u)du","Инвариантность формы первого дифференциала"],
say:`<p><b>Теорема.</b> Для сложной функции y = f(u), u = φ(x): dy = f′(u)·du.</p>
<p>Значит, форма первого дифференциала dy = f′(u)du одна и та же, независимо от того, u — независимая переменная или функция. Это <b>инвариантность формы первого дифференциала</b>.</p>`,
proof:`<p>dy = y′ₓdx = f′(u)·φ′(x)dx, а φ′(x)dx = du ⇒ dy = f′(u)du. ∎</p>`,
qa:[["Инвариантен ли второй дифференциал?","Нет: d²y = f″(u)du² + f′(u)d²u."]]},
{id:"6.15",ref:"§20.6, §20.8, §24.4, с. 171–178, 188",t:"Таблица производных. Таблица дифференциалов",
plan:["Таблица производных","Таблица дифференциалов = × dx","Вывод одной формулы (sin x или ln x)"],
say:`<p>c′ = 0; (xⁿ)′ = nxⁿ⁻¹; (aˣ)′ = aˣ ln a; (eˣ)′ = eˣ; (logₐx)′ = 1/(x ln a); (ln x)′ = 1/x;<br>(sin x)′ = cos x; (cos x)′ = −sin x; (tg x)′ = 1/cos²x; (ctg x)′ = −1/sin²x;<br>(arcsin x)′ = 1/√(1 − x²); (arccos x)′ = −1/√(1 − x²); (arctg x)′ = 1/(1 + x²); (arcctg x)′ = −1/(1 + x²).</p>
<p><b>Таблица дифференциалов</b> получается умножением на dx: d(xⁿ) = nxⁿ⁻¹dx, d(sin x) = cos x dx и т. д. По инвариантности формулы верны и для u = u(x).</p>`,
proof:`<p>(sin x)′: Δy = sin(x + Δx) − sin x = 2 sin(Δx/2)·cos(x + Δx/2). Δy/Δx = [sin(Δx/2)/(Δx/2)]·cos(x + Δx/2) → 1·cos x (первый замечательный предел).</p><p>(ln x)′: Δy/Δx = ln(1 + Δx/x)/Δx → (Δx/x)/Δx = 1/x (ln(1 + t) ~ t).</p>`,
qa:[["Выведи (eˣ)′.","Δy/Δx = eˣ(e^Δx − 1)/Δx → eˣ, так как e^Δx − 1 ~ Δx."]]},
{id:"6.16",ref:"§24.5–24.6, с. 189–191",t:"Применение дифференциала к приближенным вычислениям. Дифференциалы высших порядков. Примеры",
plan:["Δy ≈ dy","f(x₀ + Δx) ≈ f(x₀) + f′(x₀)Δx","Пример √4,02","d²y = f″dx², dⁿy = f⁽ⁿ⁾dxⁿ"],
say:`<p>При малых Δx: Δy ≈ dy ⇒ <b>f(x₀ + Δx) ≈ f(x₀) + f′(x₀)·Δx</b>.</p>
<p><b>Пример:</b> √4,02: f = √x, x₀ = 4, Δx = 0,02, f′ = 1/(2√x) = 1/4 ⇒ √4,02 ≈ 2 + 0,02/4 = 2,005.</p>
<p>Ещё пример (Письменный): arctg 1,05 ≈ arctg 1 + 0,05/(1 + 1²) = π/4 + 0,025 ≈ 0,810.</p><p><b>Дифференциалы высших порядков</b> (x — независимая переменная): d²y = d(dy) = f″(x)dx²; dⁿy = f⁽ⁿ⁾(x)dxⁿ, откуда f⁽ⁿ⁾(x) = dⁿy/dxⁿ. Если x — функция, то d²y = f″(x)dx² + f′(x)d²x — второй дифференциал не инвариантен.</p>
<p><b>Пример:</b> y = x³: dy = 3x²dx, d²y = 6x dx², d³y = 6dx³.</p>`,
qa:[["Почему dx в d(dy) — постоянная?","Приращение независимой переменной не зависит от x."]]},
{id:"6.17",ref:"§25.1, теорема 25.1, с. 192–193",t:"Исследование функций с помощью производных. Теорема Ролля",
plan:["Условия: непрерывна на [a; b], дифференцируема на (a; b), f(a) = f(b)","∃c: f′(c) = 0","Доказательство через Вейерштрасса","Геометрический смысл"],
say:`<p><b>Теорема Ролля.</b> Если f непрерывна на [a; b], дифференцируема на (a; b) и f(a) = f(b), то найдётся c ∈ (a; b): f′(c) = 0.</p>
<p><b>Геометрически:</b> на графике есть точка, где касательная параллельна оси Ox.</p>`,
proof:`<p>По Вейерштрассу f достигает на [a; b] наибольшего M и наименьшего m. Если M = m — f постоянна, f′ = 0 везде. Иначе, так как f(a) = f(b), хотя бы одно из них достигается внутри, в точке c. Пусть f(c) = M. Тогда Δy = f(c + Δx) − f(c) ≤ 0. При Δx > 0: Δy/Δx ≤ 0 ⇒ f′(c) ≤ 0; при Δx < 0: Δy/Δx ≥ 0 ⇒ f′(c) ≥ 0. Значит f′(c) = 0. ∎</p>`,
qa:[["Что если f не дифференцируема хотя бы в одной точке?","Теорема может не выполняться: |x| на [−1; 1]."]]},
{id:"6.18",ref:"§25.1, теорема 25.2, с. 193–194",t:"Исследование функций с помощью производных. Теорема Коши",
plan:["Условия, g′ ≠ 0","Формула","Вспомогательная F(x)","Ролль"],
say:`<p><b>Теорема Коши.</b> Если f и g непрерывны на [a; b], дифференцируемы на (a; b) и g′(x) ≠ 0, то ∃c ∈ (a; b):<br>(f(b) − f(a))/(g(b) − g(a)) = f′(c)/g′(c).</p>`,
proof:`<p>g(b) ≠ g(a), иначе по Роллю g′ = 0 где-то. Пусть λ = (f(b) − f(a))/(g(b) − g(a)). Рассмотрим F(x) = f(x) − f(a) − λ(g(x) − g(a)). F(a) = 0, F(b) = 0 ⇒ по Роллю ∃c: F′(c) = f′(c) − λg′(c) = 0 ⇒ λ = f′(c)/g′(c). ∎</p>`,
qa:[["Почему нельзя просто разделить формулы Лагранжа для f и g?","Точки c для f и g были бы разными."]]},
{id:"6.19",ref:"§25.1, теорема 25.3, с. 194–196",t:"Исследование функций с помощью производных. Теорема Лагранжа. Геометрический смысл теоремы Лагранжа",
plan:["Формулировка","Частный случай Коши (g = x)","Геометрический смысл: касательная ∥ хорде"],
say:`<p><b>Теорема Лагранжа.</b> Если f непрерывна на [a; b] и дифференцируема на (a; b), то ∃c ∈ (a; b): <b>f(b) − f(a) = f′(c)(b − a)</b> (формула конечных приращений).</p>
<p><b>Геометрический смысл:</b> (f(b) − f(a))/(b − a) — угловой коэффициент хорды AB. Найдётся точка c, в которой касательная параллельна хорде.</p><p>Другая запись: f(x + Δx) − f(x) = f′(x + θΔx)·Δx, 0 < θ < 1.</p><p><b>Следствие 25.1:</b> если f′(x) = 0 на промежутке, то f постоянна на нём. <b>Следствие 25.2:</b> функции с равными производными отличаются на постоянную (пример: arcsin x + arccos x = π/2).</p>`,
proof:`<p>В теореме Коши положим g(x) = x: g′ = 1, g(b) − g(a) = b − a ⇒ (f(b) − f(a))/(b − a) = f′(c). ∎</p>`,
qa:[["Связь с Роллем?","Ролль — частный случай Лагранжа при f(a) = f(b)."],["Механический смысл?","Найдётся момент, когда мгновенная скорость равна средней."]]},
{id:"6.20",ref:"§25.2, теоремы 25.4–25.5, с. 196–200",t:"Правила Лопиталя (теоремы о раскрытии неопределенностей). Примеры",
plan:["Формулировка для 0/0 и ∞/∞","Доказательство через Коши","Другие неопределённости","Примеры"],
say:`<p><b>Теорема 25.4 (0/0), теорема 25.5 (∞/∞, у Письменного без доказательства).</b> Пусть f, g дифференцируемы в окрестности x₀ (кроме, быть может, x₀), g′ ≠ 0, lim f = lim g = 0 (или ∞), и существует lim f′/g′. Тогда lim f/g = lim f′/g′.</p>
<p>Неопределённости 0·∞, ∞ − ∞ сводят к 0/0 или ∞/∞ преобразованиями; 1^∞, 0⁰, ∞⁰ — логарифмированием.</p>
<p><b>Примеры:</b> lim (x→0) (eˣ − 1)/sin x = lim eˣ/cos x = 1; lim (x→∞) x/eˣ = lim 1/eˣ = 0; lim (x→0+) x ln x = lim ln x/(1/x) = lim (1/x)/(−1/x²) = lim (−x) = 0.</p>`,
proof:`<p>(0/0) Доопределим f(x₀) = g(x₀) = 0. По теореме Коши на [x₀; x]: f(x)/g(x) = (f(x) − f(x₀))/(g(x) − g(x₀)) = f′(c)/g′(c), c между x₀ и x. При x → x₀ и c → x₀ ⇒ lim f/g = lim f′/g′. ∎</p>`,
qa:[["Можно ли применять повторно?","Да, если снова получается 0/0 или ∞/∞."],["Частая ошибка?","Дифференцировать дробь целиком (по правилу частного) вместо числителя и знаменателя отдельно."]]},
{id:"6.21",ref:"§25.3, теорема 25.6, с. 200–201",t:"Теорема о необходимых условиях возрастания и убывания функции. Геометрический смысл теоремы",
plan:["Возрастает ⇒ f′ ≥ 0","Доказательство: Δy/Δx > 0","Геометрический смысл"],
say:`<p><b>Теорема.</b> Если дифференцируемая на (a; b) функция возрастает, то f′(x) ≥ 0 на (a; b); если убывает — f′(x) ≤ 0.</p>
<p><b>Геометрический смысл:</b> касательные к графику возрастающей функции образуют с осью Ox острые углы (или параллельны ей) ⇒ tg α ≥ 0.</p>`,
proof:`<p>f возрастает ⇒ Δy и Δx одного знака ⇒ Δy/Δx > 0. Переходим к пределу (2.3): f′(x) = lim Δy/Δx ≥ 0. ∎</p>`,
qa:[["Почему ≥, а не >?","y = x³ возрастает, но f′(0) = 0."]]},
{id:"6.22",ref:"§25.3, теорема 25.7, с. 201",t:"Теорема о достаточных условиях возрастания и убывания функции. Геометрический смысл теоремы",
plan:["f′ > 0 ⇒ возрастает","Доказательство через Лагранжа","Геометрический смысл"],
say:`<p><b>Теорема.</b> Если f дифференцируема на (a; b) и f′(x) > 0 на (a; b), то f возрастает; если f′(x) < 0 — убывает.</p>
<p><b>Геометрический смысл:</b> касательные образуют с Ox острые углы ⇒ график поднимается.</p>`,
proof:`<p>Возьмём x₁ < x₂ из (a; b). По Лагранжу: f(x₂) − f(x₁) = f′(c)(x₂ − x₁), c ∈ (x₁; x₂). f′(c) > 0, x₂ − x₁ > 0 ⇒ f(x₂) > f(x₁). ∎</p>`,
qa:[["Как найти интервалы монотонности?","Найти f′, нули и точки, где её нет, определить знак f′ на интервалах."]]},
{id:"6.23",ref:"§25.4, теорема 25.8, с. 202–203",t:"Точки экстремума функции: определения. Теорема о необходимом условии экстремума",
plan:["Определение max и min","Экстремум — локальное понятие","Теорема Ферма: f′(x₀) = 0","Не достаточно: x³; бывает без производной: |x|"],
say:`<p><b>Определение.</b> x₀ — точка <b>максимума</b>, если существует δ-окрестность x₀, в которой f(x) < f(x₀) при x ≠ x₀; <b>минимума</b> — f(x) > f(x₀). Максимум и минимум — <b>экстремумы</b> (локальные).</p>
<p><b>Теорема (необходимое условие).</b> Если дифференцируемая функция имеет экстремум в x₀, то f′(x₀) = 0.</p>
<p>Условие не достаточно: y = x³, f′(0) = 0, но экстремума нет. Экстремум может быть там, где производной нет: |x| в нуле.</p>`,
proof:`<p>Пусть x₀ — max: Δy = f(x₀ + Δx) − f(x₀) < 0. При Δx > 0 Δy/Δx < 0 ⇒ f′(x₀) ≤ 0; при Δx < 0 Δy/Δx > 0 ⇒ f′(x₀) ≥ 0. Значит f′(x₀) = 0. ∎</p>`,
qa:[["Геометрический смысл?","В точке экстремума касательная горизонтальна (если существует)."],["Экстремум и наибольшее значение — одно и то же?","Нет: экстремум — локальное понятие, наибольшее значение — на всём промежутке."]]},
{id:"6.24",ref:"§25.4, теоремы 25.9–25.10, с. 203–205",t:"Критические точки функции: определения. Теорема о достаточном условии экстремума. Достаточный признак существования экстремума (теорема)",
plan:["Критические (стационарные) точки","Первое достаточное: смена знака f′","Доказательство через 6.22","Второе достаточное: знак f″","Схема исследования"],
say:`<p><b>Критические точки</b> — точки из D(f), где f′ = 0 или не существует (где f′ = 0 — <b>стационарные</b>). Экстремум может быть только в них.</p>
<p><b>Теорема (1-е достаточное условие).</b> Если f непрерывна в x₀, дифференцируема в её окрестности (кроме, быть может, x₀) и при переходе через x₀ f′ меняет знак с «+» на «−» — x₀ точка максимума; с «−» на «+» — минимума. Нет смены знака — экстремума нет.</p>
<p><b>Теорема 25.10 (2-е достаточное условие).</b> Если f′(x₀) = 0, f″(x₀) ≠ 0: при f″(x₀) < 0 — максимум, при f″(x₀) > 0 — минимум. Доказательство (f″ > 0): f″(x₀) = lim f′(x₀ + Δx)/Δx > 0, значит f′ слева от x₀ отрицательна, справа положительна — меняет знак с «−» на «+» ⇒ минимум.</p><p><b>Правило:</b> найти критические точки; оставить внутренние точки D(f); исследовать знак f′ слева и справа; выписать экстремумы и значения функции в них.</p>`,
proof:`<p>(1-е) Слева f′ > 0 ⇒ f возрастает (6.22) ⇒ f(x) < f(x₀); справа f′ < 0 ⇒ f убывает ⇒ f(x) < f(x₀). Значит x₀ — максимум. ∎</p>`,
qa:[["Схема поиска экстремумов?","D(f) → f′ → критические точки → знаки f′ на интервалах → вывод."]]},
{id:"6.25",ref:"§25.6–25.7, теоремы 25.11–25.12, с. 207–211",t:"Выпуклость графика: определения. Теорема об интервалах выпуклости. Теорема о достаточном условии существования точек перегиба. Асимптоты графика функции",
plan:["Выпуклость вверх / вниз — через касательную","f″ < 0 — вверх, f″ > 0 — вниз","Точка перегиба, смена знака f″","Асимптоты: вертикальная, горизонтальная, наклонная"],
say:`<p>График называется <b>выпуклым вниз</b> на (a; b), если он расположен выше любой своей касательной на этом интервале, и <b>выпуклым вверх</b> — если ниже. (В других учебниках: выпуклый вниз = вогнутый.)</p>
<p><b>Теорема 25.11.</b> Если f″(x) < 0 во всех точках (a; b) — график выпуклый вверх; если f″(x) > 0 — выпуклый вниз.</p>
<p><b>Точка перегиба</b> — точка графика, отделяющая выпуклую часть от вогнутой. <b>Достаточное условие:</b> если f″(x₀) = 0 или не существует и при переходе через x₀ f″ меняет знак — (x₀; f(x₀)) точка перегиба.</p>
<p><b>Асимптота</b> — прямая, расстояние до которой от точки кривой стремится к нулю при неограниченном удалении точки по кривой от начала координат. Вертикальная x = a, если lim (x→a±0) f = ±∞; горизонтальная y = b, если lim (x→±∞) f = b; наклонная y = kx + b: k = lim f(x)/x, b = lim (f(x) − kx) при x → ±∞.</p>`,
proof:`<p>Сравним ординаты кривой y и касательной Y в точке x₀: y − Y = f(x) − f(x₀) − f′(x₀)(x − x₀) = (f′(c) − f′(x₀))(x − x₀) (Лагранж) = f″(c₁)(c − x₀)(x − x₀) (снова Лагранж). (c − x₀) и (x − x₀) одного знака ⇒ знак y − Y совпадает со знаком f″. При f″ < 0 кривая ниже касательной — выпуклая вверх. ∎</p>`,
qa:[["Пример перегиба?","y = x³ в точке 0: f″ = 6x меняет знак."]]},
{id:"6.26",ref:"§26, теорема 26.1, с. 213–216; §64.1, теоремы 64.1–64.2, с. 463–465",t:"Формула Тейлора. Теорема о разложении функции в ряд Тейлора.",
plan:["Многочлен Тейлора: Pₙ⁽ᵏ⁾(x₀) = f⁽ᵏ⁾(x₀)","Формула с остатком","Rₙ в форме Лагранжа и Пеано","Ряд Тейлора, условие Rₙ → 0"],
say:`<p>Пусть f имеет производные до (n + 1)-го порядка в окрестности x₀. Ищем многочлен Pₙ(x), у которого все производные до n-й в точке x₀ совпадают с производными f — получаем коэффициенты aₖ = f⁽ᵏ⁾(x₀)/k!.</p>
<p><b>Формула Тейлора:</b> f(x) = f(x₀) + f′(x₀)(x − x₀) + f″(x₀)/2!·(x − x₀)² + … + f⁽ⁿ⁾(x₀)/n!·(x − x₀)ⁿ + Rₙ(x).</p>
<p><b>Остаток в форме Лагранжа:</b> Rₙ = f⁽ⁿ⁺¹⁾(c)/(n + 1)!·(x − x₀)ⁿ⁺¹, c между x₀ и x. <b>В форме Пеано:</b> Rₙ = o((x − x₀)ⁿ).</p>
<p>При n = 0 формула Тейлора — это формула Лагранжа; при x₀ = 0 — формула Маклорена. c = x₀ + θ(x − x₀), 0 < θ < 1.</p><p><b>Теорема 64.1 (о разложении в ряд).</b> Ряд Тейлора бесконечно дифференцируемой функции сходится к f(x) тогда и только тогда, когда lim (n→∞) Rₙ(x) = 0, то f(x) = Σ f⁽ᵏ⁾(x₀)/k!·(x − x₀)ᵏ — ряд Тейлора. <b>Теорема 64.2</b> (достаточное условие): если модули всех производных ограничены в окрестности x₀ одним числом M, то ряд Тейлора сходится к f(x).</p>`,
qa:[["Зачем нужна формула?","Приближать функцию многочленом и оценивать погрешность (Rₙ)."],["При n = 0 что получится?","Формула Лагранжа: f(x) − f(x₀) = f′(c)(x − x₀)."]]},
{id:"6.27",ref:"§26.2, с. 216; §64.2, с. 465–470; таблица на с. 601",t:"Формула Маклорена. Привести пример стандартного разложения любой из функций: ех, sin x, cos x, ln(1+x), (1+x)m",
plan:["Маклорен — Тейлор при x₀ = 0","Вывод для eˣ","Остальные разложения","Применение: e ≈ 2,718"],
say:`<p><b>Формула Маклорена</b> — формула Тейлора при x₀ = 0:<br>f(x) = f(0) + f′(0)x + f″(0)/2!·x² + … + f⁽ⁿ⁾(0)/n!·xⁿ + Rₙ(x).</p>
<p><b>Вывод для eˣ:</b> все производные равны eˣ, в нуле = 1 ⇒ <b>eˣ = 1 + x + x²/2! + x³/3! + … + xⁿ/n! + Rₙ</b>.</p>
<ul><li>sin x = x − x³/3! + x⁵/5! − …</li><li>cos x = 1 − x²/2! + x⁴/4! − …</li><li>ln(1 + x) = x − x²/2 + x³/3 − … (−1 < x ≤ 1)</li><li>(1 + x)ᵐ = 1 + mx + m(m − 1)/2!·x² + …</li></ul>
<p><b>Применение (пример Письменного):</b> e = 1 + 1 + 1/2! + … + 1/n! + Rₙ, где Rₙ < 3/(n + 1)!. При n = 6 погрешность < 0,0006, поэтому e ≈ 2,718.</p>`,
qa:[["Почему в sin x только нечётные степени?","Функция нечётная: чётные производные в нуле равны 0."]]}
];
